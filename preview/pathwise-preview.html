      this.status = status;
      this.code = code;
      this.details = details || {};
    }
  }
  const api = { ApiError, onUnauthorized: null, mock: true };

  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch { return 'UTC'; } })();
  const today = () => R.todayInTz(tz);
  let seq = 100;
  const uid = (p) => `${p}${++seq}`;
  const delay = (ms) => new Promise((r) => setTimeout(r, ms == null ? 140 : ms));

  /* ---------- seed ---------- */
  const users = [
    { id: 'u-mentor', name: 'Dr. Kavya Iyer', email: 'mentor@demo.com', password: 'mentor123', role: 'mentor', active: true },
    { id: 'u-aarav', name: 'Aarav Mehta', email: 'learner@demo.com', password: 'learner123', role: 'learner', active: true },
    { id: 'u-diya', name: 'Diya Nair', email: 'diya@demo.com', password: 'learner123', role: 'learner', active: true },
  ];
  const cohorts = [], shares = [];
  const DEMO_TOKEN = 'demo-share-link-aarav-fullstack-0001';
  let config = Object.assign({}, R.DEFAULT_CONFIG);
  const goals = [], topics = [], sessions = [], feedback = [];
  (function seed() {
    const data = window.SeedData.build(today());
    const gid = {}, tid = {};
    data.goals.forEach((g) => { const id = uid('g'); gid[g.key] = id; goals.push({ id, ownerId: 'u-aarav', title: g.title, description: g.description, color: g.color, targetDate: g.targetDate, assigned: false, assignedByName: '', requireApproval: false }); });
    let order = 0;
    data.topics.forEach((t) => { const id = uid('t'); tid[t.key] = id; topics.push({ id, goalId: gid[t.goal], ownerId: 'u-aarav', title: t.title, description: t.description, prerequisites: t.prereqs.map((k) => tid[k]), complete: !!t.completedOn, completedOn: t.completedOn, estimateMinutes: t.estimateMinutes, notes: t.notes, resources: t.resources, pending: false, review: null, order: order++ }); });
    data.sessions.forEach((s) => { const t = topics.find((x) => x.id === tid[s.topic]); sessions.push({ id: uid('s'), ownerId: 'u-aarav', goalId: t.goalId, topicId: t.id, date: s.date, time: s.time, minutes: s.minutes, note: s.note, createdAt: sessions.length }); });
    // a goal the mentor assigned to Diya, needing approval (one topic already submitted)
    const asg = window.SeedData.buildAssigned(today());
    const ag = uid('g'); const at = {};
    goals.push({ id: ag, ownerId: 'u-diya', ...asg.goal, assigned: true, assignedByName: 'Dr. Kavya Iyer', requireApproval: true });
    asg.topics.forEach((t, i) => { const id = uid('t'); at[t.key] = id; topics.push({ id, goalId: ag, ownerId: 'u-diya', title: t.title, description: t.description, prerequisites: t.prereqs.map((k) => at[k]), complete: t.status === 'complete', completedOn: t.completedOn, estimateMinutes: t.estimateMinutes, notes: '', resources: [], pending: t.pending, review: null, pendingAt: t.pending ? Date.now() : null, order: i }); });
    asg.sessions.forEach((x) => { sessions.push({ id: uid('s'), ownerId: 'u-diya', goalId: ag, topicId: at[x.topic], date: x.date, time: x.time, minutes: x.minutes, note: x.note, createdAt: sessions.length }); });
    cohorts.push({ id: uid('c'), name: 'Autumn 2026 batch', description: 'Demo cohort', members: ['u-aarav', 'u-diya'] });
    shares.push({ id: uid('sh'), token: DEMO_TOKEN, goalId: gid.web, ownerId: 'u-aarav', expiresAt: null, createdAt: new Date().toISOString() });
    feedback.push({ id: uid('f'), goalId: gid.web, authorName: 'Dr. Kavya Iyer', text: 'Great pace on Node. Finish the indexing exercises before touching Auth — it will make the security work much easier.', createdAt: new Date().toISOString() });
  })();

  let current = null; // signed-in user
  const pub = (u) => ({ id: u.id, name: u.name, email: u.email, role: u.role });
  window.DEMO_SHARE_TOKEN = DEMO_TOKEN;

  /* ---------- helpers mirroring the server ---------- */
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const fail = (code, msg, details) => { throw new R.RuleError(code, msg, details); };
  const authed = () => { if (!current) throw new ApiError('Please sign in', 401, 'UNAUTHENTICATED'); return current; };
  const canRead = (ownerId) => { const u = authed(); if (u.role !== 'mentor' && u.id !== ownerId) fail('FORBIDDEN', "You can't view another learner's data"); };
  const canEdit = (ownerId) => { const u = authed(); if (u.role !== 'learner' || u.id !== ownerId) fail('FORBIDDEN', u.role === 'mentor' ? 'Mentors have view-only access to learner goals' : 'You can only edit your own goals'); };
  const canStructure = (g) => { const u = authed(); return g.assigned ? u.role === 'mentor' : u.role === 'learner' && u.id === g.ownerId; };
  const assertStructure = (g) => { if (!canStructure(g)) fail('FORBIDDEN', g.assigned ? (current.role === 'mentor' ? 'Not allowed' : 'This goal was assigned by your mentor, so only a mentor can change its structure') : current.role === 'mentor' ? "Mentors have view-only access to learners' own goals" : 'You can only edit your own goals'); };
  const mentorOnly = () => { if (authed().role !== 'mentor') fail('FORBIDDEN', 'Only a mentor can do this'); };
  const goalOf = (id) => goals.find((g) => g.id === id) || fail('NOT_FOUND', 'Goal not found');
  const topicOf = (id) => topics.find((t) => t.id === id) || fail('NOT_FOUND', 'Topic not found');
  const topicsOfGoal = (gid) => topics.filter((t) => t.goalId === gid).sort((a, b) => a.order - b.order);
  const sessionsOfGoal = (gid) => sessions.filter((s) => s.goalId === gid).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));

  function decorate(ts, ss) {
    const mins = R.minutesByTopic(ss);
    const st = R.computeStates(ts, mins);
    const byId = new Map(ts.map((t) => [t.id, t]));
    return ts.map((t) => ({ ...t, state: st[t.id].state, locked: st[t.id].locked, missing: st[t.id].missing.map((id) => ({ id, title: byId.get(id).title })), minutes: mins[t.id] || 0, dependents: R.directDependents(ts, t.id).map((d) => ({ id: d.id, title: d.title })) }));
  }

  function goalPayload(goalId, extra) {
    const g = goalOf(goalId);
    canRead(g.ownerId);
    const ts = clone(topicsOfGoal(goalId)), ss = clone(sessionsOfGoal(goalId));
    const owner = users.find((u) => u.id === g.ownerId);
    const title = new Map(ts.map((t) => [t.id, t.title]));
    return Object.assign({
      goal: clone(g),
      owner: { id: g.ownerId, name: owner ? owner.name : 'Unknown' },
      topics: decorate(ts, ss),
      sessions: ss.slice(0, 60).map((s) => ({ ...s, topicTitle: title.get(s.topicId) || 'Removed topic' })),
      progress: R.goalProgress(ts, ss),
      forecast: F.goalForecast({ goal: g, topics: ts, sessions: ss, config, today: today() }),
      weekly: R.weeklySeries(ss, today()),
      feedback: feedback.filter((f) => f.goalId === goalId).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)).map((f) => ({ id: f.id, authorName: f.authorName, text: f.text, createdAt: f.createdAt })),
      canEdit: current.role === 'learner' && current.id === g.ownerId,
      canStructure: canStructure(g),
      canApprove: current.role === 'mentor' && !!g.requireApproval,
      shares: current.role === 'learner' && current.id === g.ownerId ? shares.filter((x) => x.goalId === goalId).map((x) => ({ id: x.id, token: x.token, expiresAt: x.expiresAt, createdAt: x.createdAt })) : [],
      config: clone(config),
      today: today(),
    }, extra || {});
  }

  function resolveLearner(learnerId) {
    const u = authed();
    let id = u.id;
    if (u.role === 'mentor') { if (!learnerId) fail('VALIDATION', 'learnerId is required'); id = learnerId; }
    else if (learnerId && learnerId !== u.id) fail('FORBIDDEN', "You can't view another learner's data");
    const l = users.find((x) => x.id === id && x.role === 'learner') || fail('NOT_FOUND', 'Learner not found');
    return l;
  }
  const dataOf = (ownerId) => ({
    goals: goals.filter((g) => g.ownerId === ownerId).map(clone),
    topics: topics.filter((t) => t.ownerId === ownerId).sort((a, b) => a.order - b.order).map(clone),
    sessions: sessions.filter((s) => s.ownerId === ownerId).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt)).map(clone),
  });

  function createFromRoadmap(goalId, ownerId, rt) {
    const ids = new Map();
    rt.forEach((t, i) => { const id = uid('t'); ids.set(t.key, id); topics.push({ id, goalId, ownerId, title: t.title, description: t.description || '', estimateMinutes: t.estimateMinutes || 0, notes: '', resources: [], pending: false, review: null, prerequisites: t.prerequisites.map((k) => ids.get(k)).filter(Boolean), complete: false, completedOn: '', order: i }); });
  }
  function learnerSummaries() {
    const t0 = today();
    return users.filter((u) => u.role === 'learner' && u.active !== false).map((l) => {
      const { goals: gs, topics: ts, sessions: ss } = dataOf(l.id);
      const done = ts.filter((t) => t.complete).length;
      const atRisk = gs.filter((g) => F.WARNING_STATUSES.includes(F.goalForecast({ goal: g, topics: ts.filter((t) => t.goalId === g.id), sessions: ss.filter((x) => x.goalId === g.id), config, today: t0 }).status)).length;
      return { id: l.id, name: l.name, email: l.email, goals: gs.length, topics: ts.length, topicsComplete: done, percent: ts.length ? Math.round((done / ts.length) * 100) : 0, minutes: ss.reduce((a, s) => a + s.minutes, 0), weekMinutes: ss.filter((s) => s.date >= R.addDays(t0, -6)).reduce((a, s) => a + s.minutes, 0), streak: R.streak(ss, t0), lastActive: ss.length ? ss[0].date : null, atRisk, pendingApprovals: ts.filter((t) => t.pending).length, cohorts: cohorts.filter((c) => c.members.includes(l.id)).map((c) => ({ id: c.id, name: c.name })) };
    });
  }
  function cohortPayload() {
    const sums = learnerSummaries();
    return cohorts.map((c) => {
      const ms = c.members.map((id) => sums.find((x) => x.id === id)).filter(Boolean);
      return { id: c.id, name: c.name, description: c.description || '', memberIds: ms.map((m) => m.id), members: ms.map((m) => ({ id: m.id, name: m.name })), stats: { learners: ms.length, avgPercent: ms.length ? Math.round(ms.reduce((a, m) => a + m.percent, 0) / ms.length) : 0, weekMinutes: ms.reduce((a, m) => a + m.weekMinutes, 0), atRisk: ms.reduce((a, m) => a + m.atRisk, 0), pendingApprovals: ms.reduce((a, m) => a + m.pendingApprovals, 0) } };
    });
  }
  function cohortInput(b) {
    b = b || {};
    const name = String(b.name || '').trim();
    if (name.length < 2 || name.length > 60) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { name: 'Name must be 2–60 characters' } });
    const ids = [...new Set(b.memberIds || [])];
    if (!ids.every((id) => users.some((u) => u.id === id && u.role === 'learner'))) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { members: 'Cohorts can only contain learners' } });
    return { name, description: String(b.description || '').slice(0, 300), members: ids };
  }

  /* ---------- endpoint implementations ---------- */
  const impl = {
    me: () => ({ user: pub(authed()) }),
    login: (email, password) => {
      const u = users.find((x) => x.email === String(email || '').toLowerCase().trim() && x.password === password);
      if (u && u.active === false) throw new ApiError('This account has been deactivated — ask your mentor', 401, 'UNAUTHENTICATED');
      if (!u) throw new ApiError('Wrong email or password', 401, 'UNAUTHENTICATED');
      current = u;
      return { user: pub(u) };
    },
    register: (name, email, password) => {
      const fields = {};
      if (!name || String(name).trim().length < 2) fields.name = 'Enter your name';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || ''))) fields.email = 'Enter a valid email';
      if (!password || String(password).length < 8) fields.password = 'At least 8 characters';
      if (Object.keys(fields).length) fail('VALIDATION', 'Please fix the highlighted fields', { fields });
      if (users.some((u) => u.email === String(email).toLowerCase())) fail('VALIDATION', 'That email is already registered', { fields: { email: 'Already registered' } });
      const u = { id: uid('u'), name: String(name).trim(), email: String(email).toLowerCase().trim(), password, role: 'learner', active: true };
      users.push(u);
      current = u;
      return { user: pub(u) };
    },
    logout: () => { current = null; return { ok: true }; },
    changePassword: (cur, nw) => {
      if (authed().password !== cur) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { currentPassword: 'Incorrect password' } });
      if (!nw || String(nw).length < 8) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { newPassword: 'At least 8 characters' } });
      current.password = String(nw);
      return { ok: true };
    },

    config: () => { authed(); return { config: clone(config) }; },
    saveConfig: (values) => {
      if (authed().role !== 'mentor') fail('FORBIDDEN', 'Only a mentor can do this');
      config = R.validateConfig(values, config);
      return { config: clone(config) };
    },

    dashboard: (learnerId) => {
      const l = resolveLearner(learnerId);
      const t0 = today();
      const { goals: gs, topics: ts, sessions: ss } = dataOf(l.id);
      const st = R.computeStates(ts, R.minutesByTopic(ss));
      const gById = new Map(gs.map((g) => [g.id, g]));
      const tTitle = new Map(ts.map((t) => [t.id, t.title]));
      const goalCards = gs.map((g) => {
        const gt = ts.filter((t) => t.goalId === g.id), gss = ss.filter((s) => s.goalId === g.id);
        const next = gt.find((t) => ['in_progress', 'available'].includes(st[t.id].state));
        return { ...g, forecast: F.goalForecast({ goal: g, topics: gt, sessions: gss, config, today: t0 }), pendingCount: gt.filter((t) => t.pending).length, progress: R.goalProgress(gt, gss), locked: gt.filter((t) => st[t.id].state === 'locked').length, nextUp: next ? { id: next.id, title: next.title, state: st[next.id].state } : null };
      });
      const last7 = ss.filter((s) => s.date >= R.addDays(t0, -6));
      const alerts = goalCards.filter((g) => F.WARNING_STATUSES.includes(g.forecast.status)).map((g) => ({ goalId: g.id, title: g.title, color: g.color, status: g.forecast.status, headline: g.forecast.headline, requiredMinutesPerWeek: g.forecast.requiredMinutesPerWeek }));
      return {
        alerts,
        learner: { id: l.id, name: l.name }, today: t0, config: clone(config),
        totals: { goals: gs.length, topics: ts.length, topicsComplete: ts.filter((t) => t.complete).length, minutes: ss.reduce((a, s) => a + s.minutes, 0), sessions: ss.length, locked: ts.filter((t) => st[t.id].state === 'locked').length, weekMinutes: last7.reduce((a, s) => a + s.minutes, 0) },
        goals: goalCards, weekly: R.weeklySeries(ss, t0), heatmap: R.heatmap(ss, t0, 42), streak: R.streak(ss, t0),
        recent: ss.slice(0, 8).map((s) => ({ ...s, topicTitle: tTitle.get(s.topicId) || 'Removed topic', goalTitle: (gById.get(s.goalId) || {}).title || '', goalColor: (gById.get(s.goalId) || {}).color || 'violet' })),
        readyToStart: ts.filter((t) => ['available', 'in_progress'].includes(st[t.id].state)).slice(0, 6).map((t) => ({ id: t.id, goalId: t.goalId, title: t.title, state: st[t.id].state, goalTitle: (gById.get(t.goalId) || {}).title, color: (gById.get(t.goalId) || {}).color })),
        canEdit: authed().role === 'learner',
      };
    },
    learners: () => {
      mentorOnly();
      return { today: today(), learners: learnerSummaries() };
    },
    insights: (learnerId) => {
      const l = resolveLearner(learnerId);
      const t0 = today();
      const { topics: ts, sessions: ss } = dataOf(l.id);
      const review = R.buildReview({ topics: ts, sessions: ss, config, today: t0 });
      return { learner: { id: l.id, name: l.name }, today: t0, review, narrative: { text: R.narrate(review, l.name), source: 'engine' }, plan: R.suggestPlan({ topics: ts, sessions: ss, config, today: t0 }), schedule: F.suggestSchedule({ topics: ts, sessions: ss, config, today: t0 }) };
    },

    goals: (learnerId) => {
      const l = resolveLearner(learnerId);
      const { goals: gs, topics: ts, sessions: ss } = dataOf(l.id);
      return { goals: gs.map((g) => { const gt = ts.filter((t) => t.goalId === g.id), gss = ss.filter((s) => s.goalId === g.id); return { ...g, progress: R.goalProgress(gt, gss), forecast: F.goalForecast({ goal: g, topics: gt, sessions: gss, config, today: today() }) }; }) };
    },
    goal: (id) => goalPayload(id),
    createGoal: (data) => {
      if (authed().role !== 'learner') fail('FORBIDDEN', 'Mentors have view-only access to learner goals');
      const clean = R.validateGoalInput(data);
      const g = { id: uid('g'), ownerId: current.id, ...clean, assigned: false, assignedByName: '', requireApproval: false };
      goals.push(g);
      return goalPayload(g.id);
    },
    updateGoal: (id, data) => {
      const g = goalOf(id);
      assertStructure(g);
      Object.assign(g, R.validateGoalInput({ ...g, ...data }));
      return goalPayload(id);
    },
    deleteGoal: (id) => {
      const g = goalOf(id);
      assertStructure(g);
      for (let i = shares.length - 1; i >= 0; i--) if (shares[i].goalId === id) shares.splice(i, 1);
      [topics, sessions, feedback].forEach((arr) => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i].goalId === id) arr.splice(i, 1); });
      goals.splice(goals.indexOf(g), 1);
      return { ok: true };
    },
    addFeedback: (goalId, text) => {
      if (authed().role !== 'mentor') fail('FORBIDDEN', 'Only a mentor can do this');
      goalOf(goalId);
      const t = String(text || '').trim();
      if (!t || t.length > 600) fail('VALIDATION', 'Write 1–600 characters', { fields: { text: 'Write 1–600 characters' } });
      feedback.push({ id: uid('f'), goalId, authorName: current.name, text: t, createdAt: new Date().toISOString() });
      return goalPayload(goalId);
    },

    createTopic: (goalId, data) => {
      const g = goalOf(goalId);
      assertStructure(g);
      const ts = topicsOfGoal(goalId);
      const clean = R.validateTopicInput(data);
      const prerequisites = R.validatePrerequisites({ topics: ts, topicId: null, prerequisites: data.prerequisites, config });
      topics.push({ id: uid('t'), goalId, ownerId: g.ownerId, ...clean, prerequisites, complete: false, completedOn: '', pending: false, review: null, order: ts.length });
      return goalPayload(goalId);
    },
    updateTopic: (id, data) => {
      const t = topicOf(id);
      assertStructure(goalOf(t.goalId));
      const siblings = topicsOfGoal(t.goalId);
      const clean = R.validateTopicInput({ ...t, ...data });
      let prerequisites = t.prerequisites;
      if (data.prerequisites !== undefined) {
        prerequisites = R.validatePrerequisites({ topics: siblings, topicId: t.id, prerequisites: data.prerequisites, config });
        const byId = new Map(siblings.map((x) => [x.id, x]));
        const incomplete = prerequisites.filter((p) => !byId.get(p).complete);
        if (t.complete && incomplete.length) fail('CONFLICT', `Reopen "${t.title}" before adding an unfinished prerequisite (${byId.get(incomplete[0]).title})`);
      }
      Object.assign(t, clean, { prerequisites });
      return goalPayload(t.goalId);
    },
    deleteTopic: (id) => {
      const t = topicOf(id);
      assertStructure(goalOf(t.goalId));
      topics.forEach((x) => { x.prerequisites = x.prerequisites.filter((p) => p !== id); });
      for (let i = sessions.length - 1; i >= 0; i--) if (sessions[i].topicId === id) sessions.splice(i, 1);
      topics.splice(topics.indexOf(t), 1);
      return goalPayload(t.goalId);
    },
    completeTopic: (id) => {
      const t = topicOf(id);
      canEdit(t.ownerId);
      const g = goalOf(t.goalId);
      const siblings = clone(topicsOfGoal(t.goalId));
      const before = R.computeStates(siblings);
      const plan = R.planComplete(siblings, id, { needsApproval: !!g.requireApproval }); // throws LOCKED with the missing prerequisites
      if (plan.changed.length) {
        if (plan.pending) { t.pending = true; t.pendingAt = Date.now(); t.review = null; }
        else { t.complete = true; t.completedOn = today(); t.pending = false; }
      }
      const payload = goalPayload(t.goalId);
      const unlocked = payload.topics.filter((x) => before[x.id].state === 'locked' && !x.locked).map((x) => ({ id: x.id, title: x.title }));
      return { ...payload, unlocked, submitted: !!plan.pending };
    },
    reopenTopic: (id) => {
      const t = topicOf(id);
      canEdit(t.ownerId);
      const plan = R.planReopen(clone(topicsOfGoal(t.goalId)), id, config);
      topics.forEach((x) => { if (plan.reopened.includes(x.id)) { x.complete = false; x.completedOn = ''; x.pending = false; } });
      return { ...goalPayload(t.goalId), reopened: plan.reopened, relocked: plan.relocked };
    },
    approveTopic: (id, comment) => {
      mentorOnly();
      const t = topicOf(id);
      R.planApprove(clone(topicsOfGoal(t.goalId)), id);
      Object.assign(t, { complete: true, completedOn: today(), pending: false, review: { status: 'approved', comment: String(comment || '').slice(0, 300), byName: current.name, at: new Date().toISOString() } });
      return goalPayload(t.goalId);
    },
    rejectTopic: (id, comment) => {
      mentorOnly();
      const t = topicOf(id);
      R.planReject(clone(topicsOfGoal(t.goalId)), id);
      const c = String(comment || '').trim();
      if (!c || c.length > 300) fail('VALIDATION', 'Tell the learner what to fix (1–300 characters)', { fields: { comment: 'Write 1–300 characters' } });
      Object.assign(t, { pending: false, review: { status: 'changes', comment: c, byName: current.name, at: new Date().toISOString() } });
      return goalPayload(t.goalId);
    },
    saveNotes: (id, body) => {
      const t = topicOf(id);
      canEdit(t.ownerId);
      const b = body || {};
      const clean = R.validateTopicInput({ ...t, notes: b.notes !== undefined ? b.notes : t.notes, resources: b.resources !== undefined ? b.resources : t.resources });
      t.notes = clean.notes; t.resources = clean.resources;
      return goalPayload(t.goalId);
    },
    importGoal: (goal, tps) => {
      if (authed().role !== 'learner') fail('FORBIDDEN', 'Only learners can do this');
      const meta = R.validateGoalInput(goal || {});
      const road = F.sanitizeRoadmap({ topics: tps }, config);
      const g = { id: uid('g'), ownerId: current.id, ...meta, assigned: false, assignedByName: '', requireApproval: false };
      goals.push(g);
      createFromRoadmap(g.id, current.id, road.topics);
      return goalPayload(g.id);
    },
    createShare: (goalId, days) => {
      const g = goalOf(goalId);
      canEdit(g.ownerId);
      if (![0, 7, 30, 90].includes(Number(days))) fail('VALIDATION', 'Choose 7, 30, 90 days or no expiry');
      shares.push({ id: uid('sh'), token: 'pw' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + Date.now().toString(36), goalId, ownerId: g.ownerId, expiresAt: days ? new Date(Date.now() + days * 86400000).toISOString() : null, createdAt: new Date().toISOString() });
      return goalPayload(goalId);
    },
    revokeShare: (id) => {
      const sh = shares.find((x) => x.id === id) || fail('NOT_FOUND', 'Share link not found');
      canEdit(sh.ownerId);
      shares.splice(shares.indexOf(sh), 1);
      return goalPayload(sh.goalId);
    },
    sharedGoal: (token) => {
      const sh = shares.find((x) => x.token === token);
      if (!sh || (sh.expiresAt && new Date(sh.expiresAt) < new Date())) fail('NOT_FOUND', 'This link is invalid, expired or has been revoked');
      const g = goalOf(sh.goalId);
      const ts = clone(topicsOfGoal(g.id)), ss = clone(sessionsOfGoal(g.id));
      const owner = users.find((u) => u.id === g.ownerId);
      return {
        readOnly: true, learnerFirstName: owner ? owner.name.split(/\s+/)[0] : 'A learner',
        goal: { title: g.title, description: g.description, color: g.color, targetDate: g.targetDate },
        topics: decorate(ts, ss).map((t) => ({ id: t.id, title: t.title, description: t.description, prerequisites: t.prerequisites, state: t.state, locked: t.locked, missing: t.missing, minutes: t.minutes, estimateMinutes: t.estimateMinutes, completedOn: t.completedOn })),
        progress: R.goalProgress(ts, ss), weekly: R.weeklySeries(ss, today()), forecast: F.goalForecast({ goal: g, topics: ts, sessions: ss, config, today: today() }), expiresAt: sh.expiresAt, today: today(),
      };
    },

    /* ----- AI features: the preview always uses the built-in logic ----- */
    roadmap: (subject, level) => {
      authed();
      const sub = String(subject || '').trim().replace(/^(i want to |i'd like to |please )?(learn|study|master)\s+/i, '');
      if (sub.length < 2) fail('VALIDATION', 'What would you like to learn?', { fields: { subject: 'Enter a subject' } });
      const fb = F.fallbackRoadmap({ subject: sub, level: level || 'beginner' });
      const road = F.sanitizeRoadmap(fb, config);
      return { roadmap: { title: road.title || sub, description: road.description || '', topics: road.topics }, source: fb.source === 'template' ? 'template' : 'generic', ai: false };
    },
    quiz: (topicId) => {
      const t = topicOf(topicId);
      canRead(t.ownerId);
      const pre = t.prerequisites.map((id) => (topics.find((x) => x.id === id) || {}).title).filter(Boolean);
      return { quiz: F.fallbackQuiz(t, pre), source: 'builtin', topic: { id: t.id, title: t.title } };
    },
    quizAttempt: (topicId, score, total) => { const t = topicOf(topicId); canEdit(t.ownerId); return { attempts: [{ score, total, at: new Date().toISOString() }] }; },
    coach: (message) => {
      const u = authed();
      if (u.role !== 'learner') fail('VALIDATION', 'The coach is for learners');
      const m = String(message || '').trim();
      if (!m) fail('VALIDATION', 'Type a message');
      const d = dataOf(u.id);
      const ctx = F.buildCoachContext({ name: u.name, goals: d.goals, topics: d.topics, sessions: d.sessions, config, today: today() });
      return { reply: F.coachFallback(m, ctx), source: 'builtin', chips: F.COACH_CHIPS };
    },

    /* ----- export (the preview shows the CSV instead of downloading) ----- */
    exportUrl: () => '#',
    exportDownload: (kind, params) => {
      const p = params || {};
      const l = resolveLearner(p.learnerId);
      let d = dataOf(l.id);
      if (p.goalId) d = { goals: d.goals.filter((g) => g.id === p.goalId), topics: d.topics.filter((t) => t.goalId === p.goalId), sessions: d.sessions.filter((x) => x.goalId === p.goalId) };
      return { filename: `pathwise-${kind}.csv`, text: kind === 'sessions' ? F.sessionsCsv(d) : F.topicsCsv(d) };
    },

    /* ----- people, cohorts, assignment, approvals (mentor only) ----- */
    adminUsers: () => { mentorOnly(); return { users: users.map((u) => ({ ...pub(u), active: u.active !== false, cohorts: cohorts.filter((c) => c.members.includes(u.id)).map((c) => ({ id: c.id, name: c.name })) })) }; },
    adminCreateUser: (b) => {
      mentorOnly();
      b = b || {};
      const fields = {};
      if (!b.name || String(b.name).trim().length < 2) fields.name = 'Enter a name';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(b.email || ''))) fields.email = 'Enter a valid email';
      if (!['learner', 'mentor'].includes(b.role)) fields.role = 'Choose learner or mentor';
      if (b.password && String(b.password).length < 8) fields.password = 'At least 8 characters';
      if (Object.keys(fields).length) fail('VALIDATION', 'Please fix the highlighted fields', { fields });
      if (users.some((u) => u.email === String(b.email).toLowerCase().trim())) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { email: 'Already registered' } });
      const pw = b.password ? String(b.password) : Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8).toUpperCase();
      const u = { id: uid('u'), name: String(b.name).trim(), email: String(b.email).toLowerCase().trim(), password: pw, role: b.role, active: true };
      users.push(u);
      return { user: { ...pub(u), active: true }, tempPassword: b.password ? null : pw };
    },
    adminUpdateUser: (id, b) => {
      mentorOnly();
      const u = users.find((x) => x.id === id) || fail('NOT_FOUND', 'User not found');
      b = b || {};
      const self = u.id === current.id;
      const others = () => users.filter((x) => x.role === 'mentor' && x.active !== false && x.id !== u.id).length;
      if (b.name !== undefined) { if (String(b.name).trim().length < 2) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { name: 'Enter a name' } }); u.name = String(b.name).trim(); }
      if (b.role !== undefined && b.role !== u.role) { if (self) fail('CONFLICT', "You can't change your own role"); if (u.role === 'mentor' && !others()) fail('CONFLICT', 'There must always be at least one active mentor'); u.role = b.role; }
      if (b.active !== undefined && !!b.active !== (u.active !== false)) { if (!b.active) { if (self) fail('CONFLICT', "You can't deactivate your own account"); if (u.role === 'mentor' && !others()) fail('CONFLICT', 'There must always be at least one active mentor'); } u.active = !!b.active; }
      return { user: { ...pub(u), active: u.active !== false } };
    },
    adminResetPassword: (id) => { mentorOnly(); const u = users.find((x) => x.id === id) || fail('NOT_FOUND', 'User not found'); u.password = Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8).toUpperCase(); return { tempPassword: u.password }; },
    cohorts: () => { mentorOnly(); return { cohorts: cohortPayload() }; },
    createCohort: (b) => { mentorOnly(); const d = cohortInput(b); if (cohorts.some((c) => c.name === d.name)) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { name: 'A cohort with this name already exists' } }); cohorts.push({ id: uid('c'), ...d }); return { cohorts: cohortPayload() }; },
    updateCohort: (id, b) => { mentorOnly(); const c = cohorts.find((x) => x.id === id) || fail('NOT_FOUND', 'Cohort not found'); const d = cohortInput({ ...c, memberIds: c.members, ...b }); if (cohorts.some((x) => x.name === d.name && x.id !== id)) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { name: 'A cohort with this name already exists' } }); Object.assign(c, d); return { cohorts: cohortPayload() }; },
    deleteCohort: (id) => { mentorOnly(); const c = cohorts.find((x) => x.id === id) || fail('NOT_FOUND', 'Cohort not found'); cohorts.splice(cohorts.indexOf(c), 1); return { cohorts: cohortPayload() }; },
    assignGoal: (b) => {
      mentorOnly();
      b = b || {};
      const meta = R.validateGoalInput(b.goal || {});
      const road = F.sanitizeRoadmap({ topics: b.topics }, config);
      const ids = new Set(b.learnerIds || []);
      (b.cohortIds || []).forEach((cid) => { const c = cohorts.find((x) => x.id === cid) || fail('NOT_FOUND', 'Cohort not found'); c.members.forEach((m) => ids.add(m)); });
      if (!ids.size) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { learnerIds: 'Choose at least one learner or cohort' } });
      const ls = [...ids].map((id) => users.find((u) => u.id === id && u.role === 'learner' && u.active !== false));
      if (ls.some((x) => !x)) fail('VALIDATION', 'Only active learners can be assigned goals');
      ls.forEach((l) => { const g = { id: uid('g'), ownerId: l.id, ...meta, assigned: true, assignedByName: current.name, requireApproval: !!b.requireApproval, createdAt: Date.now() }; goals.push(g); createFromRoadmap(g.id, l.id, road.topics); });
      return { assignedTo: ls.map((l) => ({ id: l.id, name: l.name })), topics: road.topics.length };
    },
    assignedGoals: () => {
      mentorOnly();
      return { assigned: goals.filter((g) => g.assigned).map((g) => { const gt = topics.filter((t) => t.goalId === g.id); return { id: g.id, title: g.title, learnerId: g.ownerId, learnerName: (users.find((u) => u.id === g.ownerId) || {}).name, targetDate: g.targetDate, requireApproval: !!g.requireApproval, assignedByName: g.assignedByName, topics: gt.length, complete: gt.filter((t) => t.complete).length, pending: gt.filter((t) => t.pending).length }; }) };
    },
    approvals: () => {
      mentorOnly();
      return { approvals: topics.filter((t) => t.pending).sort((a, b) => (a.pendingAt || 0) - (b.pendingAt || 0)).map((t) => { const g = goalOf(t.goalId); return { topicId: t.id, title: t.title, goalId: t.goalId, goalTitle: g.title, color: g.color, learnerId: t.ownerId, learnerName: (users.find((u) => u.id === t.ownerId) || {}).name, submittedAt: t.pendingAt, minutes: sessions.filter((x) => x.topicId === t.id).reduce((a, x) => a + x.minutes, 0), estimateMinutes: t.estimateMinutes || 0 }; }) };
    },

    sessions: (params) => {
      const u = authed();
      const p = params || {};
      let ownerId = u.id;
      if (u.role === 'mentor') { if (!p.learnerId) fail('VALIDATION', 'learnerId is required'); ownerId = p.learnerId; }
      const gById = new Map(goals.map((g) => [g.id, g]));
      const tById = new Map(topics.map((t) => [t.id, t]));
      let rows = dataOf(ownerId).sessions;
      if (p.goalId) rows = rows.filter((s) => s.goalId === p.goalId);
      if (p.topicId) rows = rows.filter((s) => s.topicId === p.topicId);
      return { sessions: rows.slice(0, Math.min(Number(p.limit) || 100, 500)).map((s) => ({ ...s, topicTitle: (tById.get(s.topicId) || {}).title || 'Removed topic', goalTitle: (gById.get(s.goalId) || {}).title || '', goalColor: (gById.get(s.goalId) || {}).color || 'violet' })) };
    },
    logSession: (body) => {
      const b = body || {};
      const t = topics.find((x) => x.id === b.topicId);
      if (!t) fail('VALIDATION', 'Please fix the highlighted fields', { fields: { topic: 'Choose a topic' } });
      canEdit(t.ownerId);
      const siblings = clone(topicsOfGoal(t.goalId));
      const state = R.computeStates(siblings)[t.id];
      const clean = R.validateSession({ input: b, topic: t, state, config, today: today() });
      const s = { id: uid('s'), ownerId: t.ownerId, goalId: t.goalId, topicId: t.id, ...clean, createdAt: sessions.length + 1000 };
      sessions.push(s);
      return { session: clone(s) };
    },
    deleteSession: (id) => {
      const s = sessions.find((x) => x.id === id) || fail('NOT_FOUND', 'Session not found');
      canEdit(s.ownerId);
      sessions.splice(sessions.indexOf(s), 1);
      return { ok: true };
    },
  };

  // Expose every method with the same async signature as the real client; map RuleError → ApiError like the server does.
  Object.keys(impl).forEach((name) => {
    api[name] = async (...args) => {
      await delay();
      try {
        return clone(impl[name](...args));
      } catch (e) {
        if (e instanceof R.RuleError) throw new ApiError(e.message, STATUS[e.code] || 400, e.code, e.details);
        if (e instanceof ApiError) { if (e.status === 401 && api.onUnauthorized && name !== 'me') api.onUnauthorized(); throw e; }
        throw e;
      }
    };
  });
  return api;
})();

  function applyProps(el, props) {
    let value;
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;

      else if (k === 'style' && typeof v === 'object') {
        for (const [sk, sv] of Object.entries(v)) (sk.startsWith('--') ? el.style.setProperty(sk, sv) : (el.style[sk] = sv));
      } else if (k === 'value') value = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    return value;
  }

  function Icon(name) {
    const t = document.createElement('template');
    t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
    return t.content.firstChild;
  }
  const STATE_ICON = { complete: 'check', locked: 'lock', in_progress: 'clock', available: 'play', pending: 'hourglass' };
  const STATE_LABEL = { complete: 'Complete', locked: 'Locked', in_progress: 'In progress', available: 'Ready', pending: 'Awaiting approval' };

  const pill = (s) => h('span', { class: `pill ${s}` }, Icon(STATE_ICON[s]), STATE_LABEL[s]);

  /* ---------- formatting ---------- */

  };
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtDate = (s) => {

    const [y, m, d] = s.split('-').map(Number);

    const s = svg('svg', { class: 'graph', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'group', 'aria-label': 'Topic prerequisite map', style: { width: '100%', maxWidth: W + 'px', minWidth: Math.min(W, 680) + 'px', height: 'auto' } });
    const edges = [];
    const edgeLayer = svg('g');
    topics.forEach((t) => {
      t.prerequisites.forEach((pid) => {
        const a = pos.get(pid), b = pos.get(t.id);
        if (!a || !b) return;
        const x1 = a.x + NODE_W, y1 = a.y + TOP + NODE_H / 2, x2 = b.x, y2 = b.y + TOP + NODE_H / 2;
        const dx = Math.max(30, (x2 - x1) / 2);
        // an edge that skips columns arcs over the nodes in between instead of running through them
        const hop = (depth.get(t.id) || 0) - (depth.get(pid) || 0) > 1 ? -(NODE_H * 0.95) : 0;
        const p = svg('path', { class: `edge${byId.get(pid).complete ? ' done' : ''}`, d: `M${x1},${y1} C${x1 + dx},${y1 + hop} ${x2 - dx},${y2 + hop} ${x2},${y2}` });
        edgeLayer.append(p);
        edges.push({ from: pid, to: t.id, el: p });
      });
    });
    s.append(edgeLayer);
    const nodes = new Map();
    topics.forEach((t, i) => {
      const { x, y } = pos.get(t.id);
      const title = t.title.length > 22 ? t.title.slice(0, 21) + '…' : t.title;
      const sub = t.state === 'locked' ? `Needs ${t.missing.length} more` : t.state === 'complete' ? 'Complete' : t.state === 'pending' ? 'Awaiting approval' : t.minutes ? UI.fmtMin(t.minutes) + ' studied' : 'Ready to start';
      // Outer <g> carries the position (SVG transform attribute); the inner <g> carries the CSS animation.
      // Animating `transform` on the positioned element would override the attribute and stack every node at 0,0.
      const g = svg('g', { class: `node ${t.state}${selectedId === t.id ? ' sel' : ''}${fresh && fresh.has(t.id) ? ' just-unlocked' : ''}${done && done.has(t.id) ? ' just-done' : ''}`, tabindex: 0, role: 'button', 'aria-label': `${t.title}, ${UI.STATE_LABEL[t.state]}`, style: { animation: `fadeUp .6s ${i * 60}ms var(--ease) both` } },
        svg('title', null, t.title),
        svg('rect', { width: NODE_W, height: NODE_H, rx: 16, fill: 'var(--bg-2)' }),
        svg('rect', { class: 'body', width: NODE_W, height: NODE_H, rx: 16 }),
        svg('rect', { class: 'stripe', x: 0, y: 14, width: 4, height: NODE_H - 28, rx: 2, fill: 'var(--c)' }),
        svg('circle', { cx: 30, cy: NODE_H / 2, r: 15, fill: 'color-mix(in srgb, var(--c) 18%, transparent)' }),
        svg('g', { transform: `translate(${30 - 8},${NODE_H / 2 - 8}) scale(.67)`, fill: 'none', stroke: 'var(--c)', 'stroke-width': 2.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg('path', { d: ICON_PATH[t.state] })),
        svg('text', { x: 54, y: 26 }, title),
        svg('text', { class: 'sm', x: 54, y: 44 }, sub)
      );
      const holder = svg('g', { transform: `translate(${x},${y + TOP})` }, g);
      g.addEventListener('click', () => onSelect(t));
      g.addEventListener('keydown', (e) => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), onSelect(t)));
      const hl = (on) => {
        const rel = on ? related(topics, t.id) : null;
        nodes.forEach((n, id) => n.classList.toggle('dim', !!rel && !rel.has(id)));
        edges.forEach((e) => {
          const hot = !!rel && rel.has(e.from) && rel.has(e.to);
          e.el.classList.toggle('hot', hot);
          e.el.classList.toggle('dim', !!rel && !hot);
        });
      };
      g.addEventListener('pointerenter', () => hl(true));
      g.addEventListener('pointerleave', () => hl(false));
      g.addEventListener('focus', () => hl(true));
      g.addEventListener('blur', () => hl(false));
      nodes.set(t.id, g);
      s.append(holder);
    });
    return h('div', null, h('div', { class: 'graph-wrap' }, s),
      h('div', { class: 'gkey' },
        h('span', null, h('i', { style: { background: 'var(--mint)' } }), 'Complete'),
        h('span', null, h('i', { style: { background: 'var(--amber)' } }), 'In progress'),
        h('span', null, h('i', { style: { background: 'var(--cyan)' } }), 'Ready'),
        h('span', null, h('i', { style: { background: 'var(--locked)' } }), 'Locked'),
        h('span', null, 'Arrows point from a prerequisite to the topic it unlocks · hover to trace a path')));
  }

  /* ---------- login art: little graph that locks and unlocks ---------- */
  function heroArt() {
    const nodes = [[40, 130, 'Basics'], [200, 50, 'Core'], [200, 210, 'Practice'], [370, 130, 'Mastery']];
    const edges = [[0, 1], [0, 2], [1, 3], [2, 3]];
    const s = svg('svg', { class: 'auth-art', viewBox: '0 0 520 280', 'aria-hidden': 'true' });
    edges.forEach(([a, b], i) => {
      const A = nodes[a], B = nodes[b];
      s.append(svg('path', { class: 'edge done', style: { animationDelay: i * 0.2 + 's' }, d: `M${A[0] + 110},${A[1] + 28} C${A[0] + 170},${A[1] + 28} ${B[0] - 60},${B[1] + 28} ${B[0]},${B[1] + 28}` }));
    });
    nodes.forEach(([x, y, label], i) => {
      const locked = i === 3;
      const kind = locked ? 'locked' : i === 0 ? 'complete' : 'available';
      s.append(svg('g', { transform: `translate(${x},${y})` },
        svg('g', { class: `node ${kind}`, style: { animation: `fadeUp .8s ${i * 150}ms var(--ease) both` } },
          svg('rect', { width: 110, height: 56, rx: 16, fill: 'var(--bg-2)' }),
          svg('rect', { class: 'body', width: 110, height: 56, rx: 16 }),
          svg('circle', { cx: 28, cy: 28, r: 13, fill: 'color-mix(in srgb, var(--c) 20%, transparent)' }),
          svg('g', { transform: 'translate(20,20) scale(.67)', fill: 'none', stroke: 'var(--c)', 'stroke-width': 2.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg('path', { d: ICON_PATH[kind] })),
          svg('text', { x: 50, y: 33 }, label))));
    });
    return s;
  }

  window.Charts = { ring, bars, hBars, area, heatmap, topicGraph, heroArt };
})();

<script>/* client/js/views/forms.js */
/* Shared forms: log-session form, goal modal, topic modal. */
window.Views = window.Views || {};
(function () {
  'use strict';
  const COLORS = ['violet', 'cyan', 'mint', 'amber', 'rose', 'sky'];

  /** Builds groups for the topic <select> from goal payloads (API.goal responses). */
  Views.groupsFrom = (goalPayloads) =>
    goalPayloads.map((p) => ({ goalTitle: p.goal.title, color: p.goal.color, topics: p.topics.map((t) => ({ id: t.id, title: t.title, state: t.state, locked: t.locked, missing: t.missing })) }));

  /**
   * The session log form: date, topic, minutes, note.
   * Client-side checks mirror the server (configured min/max minutes, no future dates, no locked topics);
   * the server is still the authority and its field errors are shown inline.
   */
  Views.sessionForm = function ({ groups, config, today, presetTopicId, onSaved }) {
    const min = config.minSessionMinutes, max = config.maxSessionMinutes;
    const select = h('select', { class: 'select', name: 'topic' },
      h('option', { value: '' }, 'Choose a topic…'),
      groups.map((g) => h('optgroup', { label: g.goalTitle }, g.topics.map((t) => h('option', { value: t.id, disabled: t.locked }, t.locked ? `${t.title} (locked — needs ${t.missing.map((m) => m.title).join(', ')})` : t.title))))
    );
    if (presetTopicId) select.value = presetTopicId;
    const date = h('input', { class: 'input', type: 'date', name: 'date', value: today, max: today });
    const time = h('input', { class: 'input', type: 'time', name: 'time' });
    const minutes = h('input', { class: 'input', type: 'number', name: 'minutes', min, max, step: 1, inputmode: 'numeric', value: Math.min(max, Math.max(min, 30)) });
    const note = h('textarea', { class: 'textarea', name: 'note', maxlength: 500, placeholder: 'What did you cover? (optional)' });
    const chips = h('div', { class: 'qchips' }, [15, 25, 45, 60, 90, 120].filter((m) => m >= min && m <= max).map((m) => h('button', { type: 'button', onclick: () => (minutes.value = m) }, UI.fmtMin(m))));
    const submit = h('button', { class: 'btn primary block', type: 'submit' }, Icon('check'), 'Log session');
    const form = h('form', { novalidate: true },
      UI.field('Topic', select, 'topic'),
      h('div', { class: 'row' }, UI.field('Date', date, 'date', "Can't be in the future"), UI.field('Start time', time, 'time', 'Optional — helps plan around your habits')),
      UI.field('Minutes studied', minutes, 'minutes', `Between ${min} and ${max}`),
      chips,
      h('div', { style: { height: '14px' } }),
      UI.field('Note', note, 'note'),
      submit
    );
    const state = {
      setMinutes: (m) => (minutes.value = m),
      setTopic: (id) => (select.value = id),
    };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      UI.clearErrors(form);
      const errs = {};
      if (!select.value) errs.topic = 'Choose a topic';
      if (!date.value) errs.date = 'Pick a date';
      else if (date.value > today) errs.date = "Date can't be in the future";
      const m = Number(minutes.value);
      if (minutes.value === '' || !Number.isInteger(m)) errs.minutes = 'Enter whole minutes';
      else if (m < min || m > max) errs.minutes = `Minutes must be between ${min} and ${max}`;
      if (Object.keys(errs).length) {
        Object.entries(errs).forEach(([k, v]) => UI.setFieldError(form, k, v));
        return;
      }
      await UI.withBusy(submit, async () => {
        try {
          const r = await API.logSession({ topicId: select.value, date: date.value, minutes: m, note: note.value, time: time.value });
          UI.toast(`Logged ${UI.fmtMin(m)} of study`);
          note.value = '';
          if (onSaved) onSaved(r.session);
        } catch (err) {
          UI.applyApiError(form, err);
        }
      });
    });
    return Object.assign(state, { el: form });
  };

  Views.sessionModal = function ({ groups, config, today, presetTopicId, onSaved }) {
    UI.modal((close) => {
      const f = Views.sessionForm({ groups, config, today, presetTopicId, onSaved: (s) => { close(); onSaved && onSaved(s); } });
      return h('div', null, h('h2', null, 'Log a study session'), h('div', { class: 'sub' }, 'Locked topics can’t be studied until their prerequisites are complete.'), f.el);
    });
  };

  /** Create / edit a goal. */
  Views.goalModal = function ({ goal, onSaved }) {
    UI.modal((close) => {
      let color = (goal && goal.color) || 'violet';
      const title = h('input', { class: 'input', name: 'title', maxlength: 80, placeholder: 'e.g. Learn Rust', value: goal ? goal.title : '' });
      const desc = h('textarea', { class: 'textarea', name: 'description', maxlength: 500, placeholder: 'What does success look like?' }, goal ? goal.description : '');

      paint();
      const save = h('button', { class: 'btn primary', type: 'submit' }, goal ? 'Save changes' : 'Create goal');
      const form = h('form', { novalidate: true },
        UI.field('Goal title', title, 'title'),
        UI.field('Description', desc, 'description'),
        h('div', { class: 'row' }, UI.field('Target date', target, 'targetDate', 'Optional'), h('div', { class: 'field' }, h('label', null, 'Colour'), sw)),
        h('div', { class: 'foot' }, h('button', { class: 'btn', type: 'button', onclick: close }, 'Cancel'), save)
      );
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        UI.clearErrors(form);
        if (!title.value.trim()) return UI.setFieldError(form, 'title', 'Give the goal a title');

          try {
            const body = { title: title.value, description: desc.value, color, targetDate: target.value };
            const r = goal ? await API.updateGoal(goal.id, body) : await API.createGoal(body);

            UI.applyApiError(form, err);

        });
      });
      return h('div', null, h('h2', null, goal ? 'Edit goal' : 'New study goal'), h('div', { class: 'sub' }, goal ? 'Update the details of this goal.' : 'A goal groups the topics you want to master.'), form);
    });
  };

  /** Create / edit a topic including its prerequisites. Loops are prevented in the UI and rejected by the server. */
  Views.topicModal = function ({ data, topic, onSaved }) {
    const maxP = data.config.maxPrerequisitesPerTopic;
    const others = data.topics.filter((t) => !topic || t.id !== topic.id);
    // anything that (transitively) depends on this topic would create a loop if chosen
    const blocked = new Set();
    if (topic) {
      const walk = (id) => data.topics.forEach((t) => t.prerequisites.includes(id) && !blocked.has(t.id) && (blocked.add(t.id), walk(t.id)));
      walk(topic.id);
    }
    UI.modal((close) => {
      const chosen = new Set(topic ? topic.prerequisites : []);
      const title = h('input', { class: 'input', name: 'title', maxlength: 80, placeholder: 'e.g. Graph algorithms', value: topic ? topic.title : '' });
      const desc = h('textarea', { class: 'textarea', name: 'description', maxlength: 500, placeholder: 'Optional notes' }, topic ? topic.description : '');
      const hours = h('input', { class: 'input', name: 'estimateMinutes', type: 'number', min: 0, max: 600, step: 0.5, placeholder: 'e.g. 6', value: topic && topic.estimateMinutes ? Math.round((topic.estimateMinutes / 60) * 100) / 100 : '' });
      const count = h('span');
      const list = h('div', { class: 'checklist' });
      const paint = () => {
        count.textContent = `${chosen.size} of ${maxP} selected`;
        count.style.color = chosen.size > maxP ? 'var(--rose)' : '';
        list.replaceChildren(
          ...(others.length
            ? others.map((t) => {
                const cb = h('input', { type: 'checkbox', checked: chosen.has(t.id), disabled: blocked.has(t.id) });
                cb.addEventListener('change', () => { cb.checked ? chosen.add(t.id) : chosen.delete(t.id); paint(); });
                return h('label', { class: `check${chosen.has(t.id) ? ' on' : ''}`, style: blocked.has(t.id) ? { opacity: 0.5, cursor: 'not-allowed' } : null }, cb, h('span', null, t.title), blocked.has(t.id) ? h('small', { class: 'hint', style: { marginLeft: 'auto' } }, 'would create a loop') : null);
              })
            : [h('div', { class: 'hint' }, 'No other topics in this goal yet.')])
        );
      };
      paint();
      const save = h('button', { class: 'btn primary', type: 'submit' }, topic ? 'Save changes' : 'Add topic');
      const form = h('form', { novalidate: true },
        UI.field('Topic title', title, 'title'),
        UI.field('Description', desc, 'description'),
        UI.field('Estimated study time (hours)', hours, 'estimateMinutes', 'Optional — powers the deadline forecast'),
        h('div', { class: 'field', 'data-name': 'prerequisites' }, h('label', null, 'Prerequisites'), list, h('div', { class: 'hint' }, 'This topic stays locked until all of these are complete. ', count), h('div', { class: 'err' })),
        h('div', { class: 'foot' }, h('button', { class: 'btn', type: 'button', onclick: close }, 'Cancel'), save)
      );
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        UI.clearErrors(form);
        if (!title.value.trim()) return UI.setFieldError(form, 'title', 'Give the topic a title');
        UI.withBusy(save, async () => {
          try {
            const body = { title: title.value, description: desc.value, estimateMinutes: hours.value === '' ? 0 : Math.round(Number(hours.value) * 60), prerequisites: [...chosen] };
            const r = topic ? await API.updateTopic(topic.id, body) : await API.createTopic(data.goal.id, body);
            close();
            UI.toast(topic ? 'Topic updated' : 'Topic added');
            onSaved && onSaved(r);
          } catch (err) {
            UI.applyApiError(form, err);
          }
        });
      });
      return h('div', null, h('h2', null, topic ? 'Edit topic' : 'Add a topic'), h('div', { class: 'sub' }, 'Prerequisites must be topics in this goal, and can’t form a loop.'), form);
    });
  };
})();

  /* ----- notes & links ----- */
  Views.notesEditor = function ({ topic, canEdit, onSaved }) {
    const notes = h('textarea', { class: 'textarea', maxlength: 2000, rows: 5, placeholder: 'Key ideas, gotchas, exercises you want to redo…', disabled: !canEdit }, topic.notes || '');

    const form = h('form', { novalidate: true },

    form.addEventListener('submit', (e) => {

  /* ----- quiz ----- */
  Views.quizModal = function ({ topic, canRecord }) {
    UI.modal((close) => {
      const body = h('div', null, UI.skeleton(2, 80));
      (async () => {
        let r;
        try { r = await API.quiz(topic.id); } catch (err) { body.replaceChildren(h('p', { class: 'hint' }, err.message)); return; }
        const q = r.quiz, src = h('span', { class: 'src' }, Icon('sparkles'), r.source === 'gemini' ? 'Written by Gemini' : 'Built-in self-check');

          body.replaceChildren(src,
            h('p', { class: 'sub' }, 'Answer these out loud or on paper, then check your notes. No marks — just honest recall.'),
            h('ol', { class: 'qz-prompts' }, q.questions.map((x) => h('li', null, x.prompt))),
            h('p', { class: 'hint' }, 'Multiple-choice quizzes with answers are written by Gemini when an API key is configured.'));

          if (i >= q.questions.length) {

          }

          let answered = false;
          const exp = h('p', { class: 'qz-exp' });
          const opts = item.options.map((o, k) => h('button', { class: 'qz-opt', type: 'button', onclick: () => {
            if (answered) return; answered = true;

            exp.textContent = (ok ? 'Correct. ' : 'Not quite. ') + (item.explanation || '');
            next.style.display = '';

          const next = h('button', { class: 'btn primary', style: { display: 'none' }, onclick: () => { i++; show(); } }, i === q.questions.length - 1 ? 'See score' : 'Next', Icon('arrow'));
          body.replaceChildren(src, h('div', { class: 'hint' }, `Question ${i + 1} of ${q.questions.length}`), h('h3', { class: 'qz-q' }, item.question), h('div', { class: 'qz-opts' }, opts), exp, next);

  /* ----- share links ----- */
  Views.shareModal = function ({ data, onChange }) {

<script>/* client/js/views/goal.js */
window.Views = window.Views || {};
(function () {
  'use strict';

  /** Goal detail: animated prerequisite map, topic list, sessions, mentor feedback. */
  Views.goal = async function ({ id, query }) {

    let selectedId = query.topic || null;
    let fresh = new Set(), done = new Set();
    const root = h('div');

    const topicById = (tid) => data.topics.find((t) => t.id === tid);

    /* ---------- actions ---------- */
    async function complete(t, btn) {
      await UI.withBusy(btn, async () => {
        try {
          const r = await API.completeTopic(t.id);
          data = r;
          if (r.submitted) { UI.toast(`“${t.title}” submitted — waiting for ${data.goal.assignedByName || 'your mentor'} to approve`, 'info'); render(); return; }
          fresh = new Set(r.unlocked.map((u) => u.id));
          done = new Set([t.id]);
          const rect = btn.getBoundingClientRect();
          UI.confetti(rect.left + rect.width / 2, rect.top);
          UI.toast(r.unlocked.length ? `${t.title} complete — unlocked ${r.unlocked.map((u) => u.title).join(', ')}` : `${t.title} complete`);
          if (data.progress.percent === 100) setTimeout(() => UI.confetti(innerWidth / 2, innerHeight / 3), 500);
          render();
          setTimeout(() => { fresh = new Set(); done = new Set(); }, 4000);
        } catch (err) {
          if (err.code === 'LOCKED') {
            UI.toast(err.message, 'err');
            const el = document.querySelector('.drawer');
            if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
          } else UI.toast(err.message, 'err');

    const W = 28, H = 20;
    const done = new Set();

<script>/* client/js/views/coach.js */
/* Study coach chat: answers from the learner's real progress. */
window.Views = window.Views || {};
(function () {
  'use strict';
  Views.coach = async function () {
    const history = [];
    const log = h('div', { class: 'chat-log', 'aria-live': 'polite' });
    const chipsBox = h('div', { class: 'qchips' });
    const input = h('input', { class: 'input', placeholder: 'Ask about your progress, deadlines or what to study next…', maxlength: 500, 'aria-label': 'Message' });
    const send = h('button', { class: 'btn primary', type: 'submit', 'aria-label': 'Send' }, Icon('send'));
    const bubble = (role, text, src) => {
      const b = h('div', { class: `bubble ${role}` }, ...String(text).split('\n').map((l, i) => (i ? [h('br'), l] : l)).flat(), src ? h('small', { class: 'src' }, Icon('sparkles'), src === 'gemini' ? 'Gemini' : 'Built-in coach') : null);
      log.append(b);
      log.scrollTop = log.scrollHeight;
      return b;
    };
    const ask = async (text) => {
      text = text.trim();
      if (!text) return;
      bubble('me', text);
      input.value = '';
      const typing = h('div', { class: 'bubble ai typing' }, h('i'), h('i'), h('i'));
      log.append(typing); log.scrollTop = log.scrollHeight;
      send.disabled = true;
      try {
        const r = await API.coach(text, history.slice(-8));
        typing.remove();
        bubble('ai', r.reply, r.source);
        history.push({ role: 'user', content: text }, { role: 'assistant', content: r.reply });
        if (r.chips && !chipsBox.children.length) r.chips.forEach((c) => chipsBox.append(h('button', { type: 'button', onclick: () => ask(c) }, c)));
      } catch (err) { typing.remove(); bubble('ai', err.message); }
      send.disabled = false; input.focus();
    };
    const form = h('form', { class: 'chat-form', onsubmit: (e) => { e.preventDefault(); ask(input.value); } }, input, send);
    const root = h('div', null,
      h('div', { class: 'topbar' }, h('div', null, h('h1', null, 'Study coach'), h('p', { class: 'sub' }, 'Knows your goals, locks, deadlines and recent sessions. Answers come from your data.'))),
      h('section', { class: 'card chat reveal' }, log, chipsBox, form));
    bubble('ai', `Hi ${App.user.name.split(' ')[0]} — ask me what to study next, whether you are on track, or what is still locked.`, null);
    ['What should I study next?', "What's still locked?", 'Am I on track for my deadlines?', 'How was my week?'].forEach((c) => chipsBox.append(h('button', { type: 'button', onclick: () => ask(c) }, c)));
    return root;
  };
})();

</script>

        h('span', { class: 'sico available' }, Icon('send')), h('div', { class: 'grow' }, h('b', null, a.title), h('small', null, `${a.learnerName}${a.targetDate ? ' · target ' + UI.fmtDate(a.targetDate) : ''}`)),

      root.replaceChildren(

        h('div', { style: { margin: '0 0 18px' } }, h('div', { class: 'tabs', role: 'tablist' }, [['people', 'People'], ['cohorts', 'Cohorts'], ['assigned', 'Assigned goals']].map(([k, l]) => h('button', { role: 'tab', class: tab === k ? 'on' : '', onclick: async () => { tab = k; if (k === 'assigned' && !assigned) { paint(); await load(); } paint(); } }, l)))),

<script>/* client/js/app.js */
/* App shell: public site (landing, sign in, shared links), authenticated shell, hash router, theme. */
(function () {
  'use strict';
  const app = { user: null };
  window.App = app;
  const root = document.getElementById('app');

  /* ---------- theme ---------- */
  const getTheme = () => { try { return localStorage.getItem('spt-theme'); } catch { return null; } };
  const setTheme = (t) => { document.documentElement.dataset.theme = t; try { localStorage.setItem('spt-theme', t); } catch { /* ignore */ } };
  setTheme(getTheme() || 'dark');

  /* ---------- routing ---------- */
  // The current path lives in memory and the URL hash mirrors it, so navigation keeps working even where the
  // hash can't be written or doesn't fire events (sandboxed frames). Back/forward and #/links use the hash.
  let cur = location.hash.replace(/^#/, '') || '/';
  let pending = false;
  app.go = (path) => {
    const same = path === cur;
    cur = path;
    let viaHash = false;
    try {
      if ('#' + path !== location.hash) { location.hash = path; viaHash = true; }
    } catch { /* hash not writable here */ }
    if (viaHash && !same) {
      pending = true; // normally hashchange runs the route; this timer covers frames that never fire it
      setTimeout(() => { if (pending) { pending = false; route(); } }, 80);
    } else route();
  };
  const parse = () => {
    const [path, qs] = cur.split('?');
    return { path: path || '/', query: Object.fromEntries(new URLSearchParams(qs || '')) };
  };
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    app.go(a.getAttribute('href').slice(1));
  });
  let token = 0;
  let current = null;

  let logoSeq = 0;
  const LOGO = () => {
    const t = document.createElement('template');
    const gid = 'lg' + ++logoSeq; // unique per instance: a gradient defined in a display:none copy can't be referenced
    t.innerHTML = '<svg viewBox="0 0 40 40" fill="none"><defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#3dd9eb"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#' + gid + ')"/><path d="M11 27l7-7 4 4 8-9" stroke="#0a0b20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="15" r="2.6" fill="#0a0b20"/></svg>';
    return t.content.firstChild;
  };
  const brand = (sub) => h('div', { class: 'brand' }, LOGO(), h('div', null, 'Pathwise', sub === false ? null : h('small', null, 'Study tracker')));
  app.brand = brand;

  const aurora = () => document.querySelector('.aurora') || document.body.appendChild(h('div', { class: 'aurora' }, h('i'), h('i'), h('i')));
  const themeBtn = () => h('button', { class: 'icon-btn', 'aria-label': 'Toggle theme', title: 'Toggle theme', onclick: (e) => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; setTheme(t); e.currentTarget.replaceChildren(Icon(t === 'dark' ? 'sun' : 'moon')); } }, Icon(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon'));
  app.themeBtn = themeBtn;

  /* ---------- authenticated shell ---------- */
  function nav() {
    const mentor = app.user.role === 'mentor';
    const is = (...ps) => (p) => ps.some((x) => (x.endsWith('*') ? p.startsWith(x.slice(0, -1)) : p === x));
    const items = mentor
      ? [['/', 'users', 'Learners', (p) => p === '/' || p.startsWith('/learners') || p.startsWith('/goals')], ['/approvals', 'clipboard', 'Approvals', is('/approvals')], ['/assign', 'send', 'Assign goal', is('/assign')], ['/people', 'userplus', 'People', is('/people')], ['/settings', 'sliders', 'Settings', is('/settings')]]
      : [['/', 'home', 'Dashboard', (p) => p === '/' || p.startsWith('/goals') || p === '/roadmap'], ['/log', 'bolt', 'Log session', is('/log')], ['/insights', 'sparkles', 'Weekly plan', is('/insights')], ['/coach', 'message', 'Coach', is('/coach')], ['/settings', 'sliders', 'Settings', is('/settings')]];
    const { path } = parse();
    return h('nav', { class: 'nav', 'aria-label': 'Main' }, items.map(([to, ic, label, active]) => h('a', { href: '#' + to, class: active(path) ? 'active' : '', 'data-to': to }, Icon(ic), h('span', null, label))));
  }
  async function paintBadge() {
    if (!app.user || app.user.role !== 'mentor') return;
    try {
      const n = (await API.approvals()).approvals.length;
      root.querySelectorAll('.nav a[data-to="/approvals"]').forEach((a) => { a.querySelector('.badge') && a.querySelector('.badge').remove(); if (n) a.append(h('em', { class: 'badge' }, n)); });
    } catch { /* ignore */ }
  }
  app.refreshBadge = paintBadge;

  const logoutBtn = () => h('button', { class: 'icon-btn', 'aria-label': 'Sign out', title: 'Sign out', onclick: async () => { try { await API.logout(); } catch { /* ignore */ } app.user = null; app.go('/'); } }, Icon('logout'));

  function shell() {
    aurora();
    root.replaceChildren(
      h('div', { class: 'shell' },
        h('aside', { class: 'side' }, brand(), nav(), h('div', { class: 'spacer' }),
          h('div', { class: 'me' }, h('div', { class: 'avatar' }, UI.initials(app.user.name)), h('div', null, h('b', null, app.user.name), h('span', null, app.user.role)), themeBtn(), logoutBtn())),
        h('main', { class: 'main' },
          h('div', { class: 'mobile-bar' }, brand(), h('div', { class: 'actions' }, themeBtn(), logoutBtn())),
          h('div', { class: 'page', id: 'page' }))));
  }

  const notFound = () => h('div', { class: 'card empty' }, Icon('info'), h('h3', null, 'Page not found'), h('p', null, 'That page doesn’t exist.'), h('div', { style: { marginTop: '14px' } }, h('a', { class: 'btn primary', href: '#/' }, 'Go home')));

  async function route() {
    const { path, query } = parse();
    const my = ++token;
    if (current && current.__cleanup) current.__cleanup();
    UI.drawer.close();
    document.querySelectorAll('.scrim').forEach((s) => s.remove());

    /* a shared read-only link works for everyone, signed in or not */
    let m;
    if ((m = path.match(/^\/s\/([\w-]+)$/))) return publicPage(() => Views.sharedGoal({ token: m[1] }), my);
    if (!app.user) {
      if (path === '/') return publicPage(() => Views.landing(), my, true);
      if (path === '/login' || path === '/register') return authScreen(path === '/register' ? 'register' : 'login');
      return authScreen('login');
    }
    if (path === '/login' || path === '/register') return app.go('/');

    if (!document.getElementById('page')) shell();
    else { root.querySelector('.side nav').replaceWith(nav()); }
    paintBadge();
    const page = document.getElementById('page');
    page.replaceChildren(UI.skeleton(3, 130));
    let view;
    try {
      const mentor = app.user.role === 'mentor';
      if (path === '/') view = await (mentor ? Views.learners() : Views.dashboard({}));
      else if (path === '/log' && !mentor) view = await Views.log();
      else if (path === '/insights' && !mentor) view = await Views.insights({});
      else if (path === '/coach' && !mentor) view = await Views.coach();
      else if (path === '/roadmap' && !mentor) view = await Views.roadmap({ mode: 'learner', query });
      else if (path === '/assign' && mentor) view = await Views.roadmap({ mode: 'assign', query });
      else if (path === '/approvals' && mentor) view = await Views.approvals();
      else if (path === '/people' && mentor) view = await Views.people({ query });
      else if (path === '/settings') view = await Views.settings();
      else if ((m = path.match(/^\/goals\/([\w-]+)$/))) view = await Views.goal({ id: m[1], query });
      else if (mentor && (m = path.match(/^\/learners\/([\w-]+)$/))) view = await Views.dashboard({ learnerId: m[1] });
      else if (mentor && (m = path.match(/^\/learners\/([\w-]+)\/insights$/))) view = await Views.insights({ learnerId: m[1] });
      else view = notFound();
    } catch (err) {
      if (my !== token) return;
      view = h('div', { class: 'card empty' }, Icon('alert'), h('h3', null, err.status === 403 ? 'Not allowed' : err.status === 404 ? 'Not found' : 'Something went wrong'), h('p', null, err.message), h('div', { style: { marginTop: '14px' } }, h('a', { class: 'btn primary', href: '#/' }, 'Back to safety')));
    }
    if (my !== token) return; // a newer navigation superseded this one
    current = view;
    view.classList.add('page-enter');
    page.replaceChildren(view);
    window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', () => { cur = location.hash.replace(/^#/, '') || '/'; pending = false; route(); });

  /* ---------- public pages (no sidebar) ---------- */
  async function publicPage(build, my, wide) {
    aurora();
    root.replaceChildren(h('div', { class: 'pub' + (wide ? ' wide' : '') }, UI.skeleton(2, 200)));
    let view;
    try { view = await build(); } catch (err) {
      view = h('div', { class: 'pub-wrap' }, h('div', { class: 'card empty' }, Icon('alert'), h('h3', null, err.status === 404 ? 'Link not available' : 'Something went wrong'), h('p', null, err.message), h('div', { style: { marginTop: '14px' } }, h('a', { class: 'btn primary', href: '#/' }, 'Go to Pathwise'))));
    }
    if (my !== token) return;
    current = view;
    root.replaceChildren(view);
    window.scrollTo({ top: 0 });
  }

  /* ---------- sign in / create account ---------- */
  function authScreen(startMode) {
    aurora();
    let mode = startMode || 'login';
    const name = h('input', { class: 'input', name: 'name', autocomplete: 'name', placeholder: 'Your name' });
    const email = h('input', { class: 'input', name: 'email', type: 'email', autocomplete: 'email', placeholder: 'you@example.com' });
    const pass = h('input', { class: 'input', name: 'password', type: 'password', autocomplete: 'current-password', placeholder: '••••••••' });
    const submit = h('button', { class: 'btn primary block', type: 'submit' });
    const title = h('h2'), sub = h('p', { class: 'sub', style: { color: 'var(--muted)', marginBottom: '22px' } });
    const nameF = UI.field('Name', name, 'name');
    const form = h('form', { novalidate: true }, nameF, UI.field('Email', email, 'email'), UI.field('Password', pass, 'password'), submit);
    const toggle = h('button', { class: 'btn sm', type: 'button' });
    const demo = h('div', { class: 'demo' }, 'Try a demo:', ...[['Learner', 'learner@demo.com', 'learner123'], ['Mentor', 'mentor@demo.com', 'mentor123'], ['Assigned learner', 'diya@demo.com', 'learner123']].map(([l, e, p]) => h('button', { class: 'btn sm', type: 'button', onclick: () => { email.value = e; pass.value = p; mode = 'login'; paint(); form.requestSubmit(); } }, l)));
    const paint = () => {
      const reg = mode === 'register';
      title.textContent = reg ? 'Create your account' : 'Welcome back';
      sub.textContent = reg ? 'Start mapping what you need to learn — and in what order.' : 'Sign in to continue your study path.';
      nameF.style.display = reg ? '' : 'none';
      submit.replaceChildren(reg ? 'Create account' : 'Sign in', Icon('arrow'));
      toggle.textContent = reg ? 'I already have an account' : 'New here? Create an account';
      pass.autocomplete = reg ? 'new-password' : 'current-password';
      UI.clearErrors(form);
    };
    toggle.addEventListener('click', () => { mode = mode === 'login' ? 'register' : 'login'; paint(); });
    paint();
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      UI.clearErrors(form);
      const errs = {};
      if (mode === 'register' && name.value.trim().length < 2) errs.name = 'Enter your name';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) errs.email = 'Enter a valid email';
      if (!pass.value) errs.password = 'Enter your password';
      else if (mode === 'register' && pass.value.length < 8) errs.password = 'At least 8 characters';
      if (Object.keys(errs).length) return Object.entries(errs).forEach(([k, v]) => UI.setFieldError(form, k, v));
      UI.withBusy(submit, async () => {
        try {
          const r = mode === 'login' ? await API.login(email.value, pass.value) : await API.register(name.value, email.value, pass.value);
          app.user = r.user;
          root.replaceChildren();
          pending = false;
          cur = '/';
          try { location.hash = '/'; } catch { /* ignore */ }
          route();
        } catch (err) {
          if (err.status === 401) { UI.setFieldError(form, 'password', err.message); }
          else UI.applyApiError(form, err);
        }
      });
    });
    root.replaceChildren(
      h('div', { class: 'auth' },
        h('section', { class: 'auth-hero' }, h('a', { href: '#/', style: { textDecoration: 'none', color: 'inherit' } }, brand()),
          h('h1', null, 'Study in the ', h('em', null, 'right order.')),
          h('p', null, 'Map every topic, lock what isn’t ready, and unlock the next step the moment you finish a prerequisite. Track time, keep streaks, and get a weekly plan.'),
          Charts.heroArt()),
        h('section', { class: 'auth-panel' }, h('div', { class: 'card auth-card reveal' }, title, sub, form, h('div', { style: { marginTop: '14px', textAlign: 'center' } }, toggle), demo, h('div', { style: { marginTop: '12px', textAlign: 'center' } }, h('a', { class: 'hint', href: '#/' }, '← Back to home'))))));
  }

  /* ---------- boot ---------- */
  async function boot() {
    API.onUnauthorized = () => { if (app.user) { app.user = null; UI.toast('Please sign in again', 'info'); app.go('/login'); } };
    try {
      app.user = (await API.me()).user;
    } catch {
      app.user = null;
    }
    route();
  }
  boot();
})();

</script>
