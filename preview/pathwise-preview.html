<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pathwise — Study Progress Tracker</title>
    <meta name="description" content="Track study goals with prerequisite rules: topics stay locked until what they depend on is complete." />
    <meta name="theme-color" content="#090a1c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%238b7cff'/%3E%3Cpath d='M11 27l7-7 4 4 8-9' stroke='%230a0b20' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
/* ==========================================================================
   Pathwise — Study Progress Tracker
   Palette: deep-ink night + aurora accents.
     violet #8B7CFF  primary / brand        cyan  #3DD9EB  available / focus
     mint   #3DDC97  complete / success     amber #FFC857  in progress
     rose   #FF6B8B  errors / destructive   slate #6B7099  locked
   ========================================================================== */

:root {
  --bg: #090a1c;
  --bg-2: #0f1130;
  --surface: rgba(255, 255, 255, 0.045);
  --surface-2: rgba(255, 255, 255, 0.075);
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.18);
  --text: #eceeff;
  --muted: #9aa0c7;
  --faint: #6b7099;
  --violet: #8b7cff;
  --cyan: #3dd9eb;
  --mint: #3ddc97;
  --amber: #ffc857;
  --rose: #ff6b8b;
  --sky: #6aa8ff;
  --locked: #6b7099;
  --shadow: 0 10px 40px rgba(2, 3, 20, 0.55);
  --radius: 18px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  color-scheme: dark;
}
[data-theme='light'] {
  --bg: #f3f4ff;
  --bg-2: #e9ebff;
  --surface: rgba(255, 255, 255, 0.72);
  --surface-2: rgba(255, 255, 255, 0.95);
  --border: rgba(40, 44, 110, 0.12);
  --border-strong: rgba(40, 44, 110, 0.25);
  --text: #15183d;
  --muted: #565b8a;
  --faint: #8a8fb8;
  --violet: #6b58f5;
  --cyan: #0aa8c0;
  --mint: #12a46b;
  --amber: #d99100;
  --rose: #e03a62;
  --sky: #2f7be8;
  --locked: #8a8fb8;
  --shadow: 0 10px 30px rgba(50, 55, 130, 0.14);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -0.02em; margin: 0; line-height: 1.15; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
::selection { background: color-mix(in srgb, var(--violet) 55%, transparent); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- aurora background ---------- */
.aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: radial-gradient(1200px 700px at 80% -10%, var(--bg-2), transparent 70%), var(--bg); }
.aurora i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; will-change: transform; }
.aurora i:nth-child(1) { width: 520px; height: 520px; background: var(--violet); left: -120px; top: -140px; animation: drift1 26s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { width: 460px; height: 460px; background: var(--cyan); right: -140px; top: 18%; opacity: 0.3; animation: drift2 32s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { width: 520px; height: 520px; background: #ff6bd5; left: 30%; bottom: -260px; opacity: 0.22; animation: drift3 30s ease-in-out infinite alternate; }
[data-theme='light'] .aurora i { opacity: 0.28; }
.aurora::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%); opacity: 0.35; }
@keyframes drift1 { to { transform: translate(180px, 120px) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-160px, 90px) scale(0.9); } }
@keyframes drift3 { to { transform: translate(-120px, -140px) scale(1.2); } }

/* ---------- shell ---------- */
#app { position: relative; z-index: 1; min-height: 100vh; }
.shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px;
  border-right: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(18px);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 10px 22px; font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: -0.03em; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand small { display: block; font: 500 10.5px var(--font); letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-top: 1px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: var(--muted); font-weight: 500; position: relative;
  transition: color 0.25s, background 0.25s, transform 0.25s var(--ease);
}
.nav a svg { width: 19px; height: 19px; flex: none; }
.nav a:hover { color: var(--text); background: var(--surface); transform: translateX(3px); }
.nav a.active { color: var(--text); background: linear-gradient(90deg, color-mix(in srgb, var(--violet) 30%, transparent), transparent); }
.nav a.active::before { content: ''; position: absolute; left: -16px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--violet); box-shadow: 0 0 18px var(--violet); }
.side .spacer { flex: 1; }
.me { display: flex; align-items: center; gap: 11px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
.avatar { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font: 700 14px var(--display); color: #0b0c22; background: linear-gradient(135deg, var(--violet), var(--cyan)); flex: none; }
.me b { display: block; font-size: 13.5px; line-height: 1.2; }
.me span { font-size: 11.5px; color: var(--muted); text-transform: capitalize; }
.me .icon-btn { margin-left: auto; }
.main { padding: 28px clamp(18px, 3.2vw, 44px) 80px; min-width: 0; }
.page { max-width: 1240px; margin: 0 auto; }
.page-enter { animation: pageIn 0.55s var(--ease) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(16px) scale(0.99); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }
.topbar h1 { font-size: clamp(26px, 3.4vw, 36px); }
.topbar .sub { color: var(--muted); margin-top: 5px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- buttons / inputs ---------- */
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--border-strong);
  background: var(--surface); font-weight: 600; font-size: 14px; transition: transform 0.2s var(--ease), box-shadow 0.3s, background 0.3s, border-color 0.3s; white-space: nowrap;
}
.btn svg { width: 17px; height: 17px; }
.btn:hover { transform: translateY(-2px); background: var(--surface-2); }
.btn:active { transform: translateY(0) scale(0.98); }
.btn.primary { border: 0; color: #0a0b20; background: linear-gradient(135deg, var(--violet), var(--cyan)); background-size: 160% 160%; box-shadow: 0 8px 26px -6px color-mix(in srgb, var(--violet) 70%, transparent); }
.btn.primary:hover { background-position: 100% 50%; box-shadow: 0 12px 34px -6px color-mix(in srgb, var(--violet) 85%, transparent); }
.btn.mint { border: 0; color: #04210f; background: linear-gradient(135deg, var(--mint), #b6f36b); box-shadow: 0 8px 26px -8px color-mix(in srgb, var(--mint) 80%, transparent); }
.btn.danger { color: var(--rose); border-color: color-mix(in srgb, var(--rose) 45%, transparent); }
.btn.danger:hover { background: color-mix(in srgb, var(--rose) 14%, transparent); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn[aria-disabled='true'], .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.block { width: 100%; }
.ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.45); transform: scale(0); animation: ripple 0.65s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(3.4); opacity: 0; } }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); transition: transform 0.2s var(--ease), background 0.2s; }
.icon-btn:hover { background: var(--surface-2); transform: rotate(-6deg) scale(1.06); }
.icon-btn svg { width: 18px; height: 18px; }

.field { display: grid; gap: 7px; margin-bottom: 16px; }
.field > label, .label { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.input, .select, .textarea {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-strong); background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--text); font: inherit;
  transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
}
.select option, .select optgroup { background: var(--bg-2); color: var(--text); }
.textarea { min-height: 86px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 4px color-mix(in srgb, var(--violet) 22%, transparent); }
.field.invalid .input, .field.invalid .select, .field.invalid .textarea { border-color: var(--rose); animation: shake 0.4s; }
.err { color: var(--rose); font-size: 12.5px; min-height: 0; display: none; }
.field.invalid .err { display: block; animation: fadeUp 0.25s both; }
.hint { font-size: 12px; color: var(--faint); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.shake { animation: shake 0.45s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- cards ---------- */
.card {
  position: relative; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(14px); padding: 22px; box-shadow: var(--shadow);
  transition: transform 0.35s var(--ease), border-color 0.3s, box-shadow 0.3s;
}
.card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 0.35s; background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--c, var(--violet)) 22%, transparent), transparent 60%); }
.card.tilt:hover { border-color: var(--border-strong); }
.card.tilt:hover::before { opacity: 1; }
.card h3 { font-size: 17px; margin-bottom: 4px; }
.card .sub { color: var(--muted); font-size: 13px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.grid { display: grid; gap: 18px; }
.grid > * { min-width: 0; }
.g-4 { grid-template-columns: repeat(4, 1fr); }
.g-3 { grid-template-columns: repeat(3, 1fr); }
.g-2 { grid-template-columns: repeat(2, 1fr); }
.g-main { grid-template-columns: 1.55fr 1fr; align-items: start; }
.reveal { opacity: 0; animation: fadeUp 0.6s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 70ms + 60ms); }

.c-violet { --c: var(--violet); } .c-cyan { --c: var(--cyan); } .c-mint { --c: var(--mint); }
.c-amber { --c: var(--amber); } .c-rose { --c: var(--rose); } .c-sky { --c: var(--sky); }

/* ---------- hero + kpis ---------- */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; padding: 30px; overflow: hidden; background: linear-gradient(135deg, color-mix(in srgb, var(--violet) 22%, transparent), color-mix(in srgb, var(--cyan) 10%, transparent) 60%, var(--surface)); }
.hero::after { content: ''; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; background: conic-gradient(from 0deg, var(--violet), var(--cyan), var(--mint), var(--violet)); filter: blur(60px); opacity: 0.22; animation: spin 18s linear infinite; pointer-events: none; }
.hero h2 { font-size: clamp(26px, 3.6vw, 38px); }
.hero p { color: var(--muted); margin-top: 8px; max-width: 52ch; }
.hero .chips { margin-top: 18px; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
.chip svg { width: 15px; height: 15px; }
.chip.flame { color: var(--amber); }
.chip.flame svg { animation: flicker 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.18) rotate(3deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
.kpi { display: flex; align-items: center; gap: 15px; padding: 18px 20px; }
.kpi .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); flex: none; }
.kpi .ico svg { width: 22px; height: 22px; }
.kpi b { display: block; font: 700 27px var(--display); letter-spacing: -0.03em; line-height: 1.05; }
.kpi > div:last-child > span { color: var(--muted); font-size: 12.5px; }

/* ---------- goal cards ---------- */
.goal-card { cursor: pointer; display: grid; gap: 16px; overflow: hidden; }
.goal-card:hover { transform: translateY(-6px); }
.goal-card::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--c), transparent); }
.goal-top { display: flex; gap: 16px; align-items: center; }
.goal-top h3 { margin: 0 0 3px; font-size: 18px; }
.goal-top p { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ring { position: relative; flex: none; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .trk { stroke: var(--border-strong); opacity: 0.6; }
.ring .bar { stroke: var(--c, var(--violet)); stroke-linecap: round; transition: stroke-dashoffset 1.4s var(--ease); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c, var(--violet)) 60%, transparent)); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font: 700 var(--fs, 20px) var(--display); letter-spacing: -0.03em; }
.ring .num small { font-size: 0.5em; opacity: 0.7; margin-left: 1px; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg { width: 14px; height: 14px; }
.next { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--c) 10%, transparent); font-size: 13px; }
.next svg { width: 16px; height: 16px; color: var(--c); flex: none; }
.next b { font-weight: 600; }
.add-card { display: grid; place-items: center; text-align: center; border: 2px dashed var(--border-strong); background: transparent; box-shadow: none; min-height: 210px; color: var(--muted); cursor: pointer; }
.add-card:hover { color: var(--text); border-color: var(--violet); transform: translateY(-4px); }
.add-card .plus { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 10px; background: var(--surface-2); transition: transform 0.4s var(--ease); }
.add-card:hover .plus { transform: rotate(90deg) scale(1.1); }

/* ---------- pills + lists ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
.pill svg { width: 12px; height: 12px; }
.pill.complete { color: var(--mint); background: color-mix(in srgb, var(--mint) 15%, transparent); }
.pill.in_progress { color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent); }
.pill.available { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 15%, transparent); }
.pill.locked { color: var(--faint); background: color-mix(in srgb, var(--locked) 18%, transparent); }
.list { display: grid; gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 13px; background: var(--surface); border: 1px solid var(--border); transition: transform 0.25s var(--ease), border-color 0.25s, background 0.25s; }
.li.click { cursor: pointer; }
.li.click:hover { transform: translateX(5px); border-color: var(--border-strong); background: var(--surface-2); }
.li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--violet)); box-shadow: 0 0 12px var(--c, var(--violet)); flex: none; }
.li .grow { flex: 1; min-width: 0; }
.li b { font-weight: 600; font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li small { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li > svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.li .end { font: 600 13px var(--display); color: var(--muted); white-space: nowrap; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.empty svg { width: 42px; height: 42px; opacity: 0.55; margin-bottom: 8px; }

/* ---------- charts ---------- */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 500 11px var(--font); }
.chart .grid-l { stroke: var(--border); stroke-dasharray: 3 5; }
.chart .gbar { transform-box: fill-box; transform-origin: bottom; animation: grow 0.9s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 150ms); }
.chart .gbar:hover { filter: brightness(1.25); }
.chart .hbar { transform-box: fill-box; transform-origin: left; animation: growx 0.9s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms + 150ms); }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.chart .draw { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000); animation: draw 1.6s var(--ease) 0.2s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.chart .area { opacity: 0; animation: fadeIn 1s 0.9s forwards; }
@keyframes fadeIn { to { opacity: 1; } }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.heat .dow { text-align: center; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--faint); text-transform: uppercase; padding-bottom: 2px; }
.heat i { display: block; height: 30px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); opacity: 0; animation: pop 0.5s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 14ms + 200ms); transition: transform 0.2s var(--ease); }
.heat i[data-l='1'] { background: color-mix(in srgb, var(--violet) 30%, var(--surface-2)); }
.heat i[data-l='2'] { background: color-mix(in srgb, var(--violet) 55%, var(--surface-2)); }
.heat i[data-l='3'] { background: color-mix(in srgb, var(--violet) 80%, var(--surface-2)); }
.heat i[data-l='4'] { background: var(--cyan); box-shadow: 0 0 12px color-mix(in srgb, var(--cyan) 60%, transparent); }
.heat i:hover { transform: scale(1.3); z-index: 2; }
@keyframes pop { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
.legend { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 12px; justify-content: flex-end; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; background: var(--surface-2); border: 1px solid var(--border); }
.tip { position: fixed; z-index: 200; pointer-events: none; padding: 7px 11px; border-radius: 10px; font-size: 12.5px; background: var(--bg-2); border: 1px solid var(--border-strong); box-shadow: var(--shadow); transform: translate(-50%, -125%); opacity: 0; transition: opacity 0.15s; white-space: nowrap; }
.tip.on { opacity: 1; }

/* ---------- goal page: header, tabs, graph ---------- */
.back { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13.5px; margin-bottom: 14px; transition: color 0.2s, transform 0.2s var(--ease); }
.back:hover { color: var(--text); transform: translateX(-4px); }
.back svg { width: 16px; height: 16px; }
.goal-hero { display: flex; gap: 26px; align-items: center; padding: 26px 28px; margin-bottom: 20px; overflow: hidden; background: linear-gradient(120deg, color-mix(in srgb, var(--c) 22%, transparent), var(--surface) 65%); }
.goal-hero h1 { font-size: clamp(24px, 3vw, 34px); }
.goal-hero p { color: var(--muted); margin: 7px 0 14px; max-width: 60ch; }
.tabs { display: inline-flex; padding: 4px; gap: 3px; border-radius: 13px; background: var(--surface); border: 1px solid var(--border); }

.graph-wrap { overflow-x: auto; padding: 6px 0 2px; }
.graph { display: block; margin: 0 auto; }
.node { cursor: pointer; }
.node rect.body { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.5; transition: stroke 0.25s, filter 0.25s, transform 0.3s var(--ease); }

.node .stripe { transition: opacity 0.3s; }
.node.complete { --c: var(--mint); } .node.in_progress { --c: var(--amber); } .node.available { --c: var(--cyan); } .node.locked { --c: var(--locked); }
.node.locked rect.body { fill: color-mix(in srgb, var(--locked) 12%, var(--surface)); }
.node.locked text:not(.sm) { fill: var(--muted); }

.node.available rect.body { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 50% { stroke: var(--cyan); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--cyan) 50%, transparent)); } }
.node.just-unlocked rect.body { animation: unlock 1.6s var(--ease) 2; }

.node.just-done { animation: donePop 0.7s var(--ease); transform-box: fill-box; transform-origin: center; }
@keyframes donePop { 40% { transform: scale(1.1); } }
.edge { fill: none; stroke: var(--locked); stroke-width: 1.8; stroke-dasharray: 5 6; opacity: 0.55; transition: opacity 0.25s, stroke 0.25s; }
.edge.done { stroke: var(--mint); opacity: 0.9; stroke-dasharray: 8 7; animation: flow 1.1s linear infinite; }

.edge.dim { opacity: 0.1; }
@keyframes flow { to { stroke-dashoffset: -30; } }
.gkey { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
.gkey span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- modal / drawer / toast ---------- */

.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 300; display: grid; gap: 10px; justify-items: end; }
.toast { display: flex; align-items: center; gap: 11px; padding: 13px 17px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--border-strong); box-shadow: var(--shadow); max-width: min(380px, 90vw); animation: toastIn 0.5s var(--ease) both; font-size: 14px; }
.toast.out { animation: toastOut 0.35s ease-in forwards; }

.toast.ok svg { color: var(--mint); } .toast.err svg { color: var(--rose); } .toast.info svg { color: var(--cyan); }

@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
#confetti { position: fixed; inset: 0; z-index: 400; pointer-events: none; }

/* ---------- login ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; position: relative; z-index: 1; }

/* ---------- misc pages ---------- */

.src { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--violet) 18%, transparent); color: var(--violet); }

.stat { text-align: center; padding: 14px 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }

.skeleton { border-radius: 14px; background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 300% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }

@keyframes pulse { 50% { transform: scale(1.25); } }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .g-4 { grid-template-columns: repeat(2, 1fr); } .g-3 { grid-template-columns: repeat(2, 1fr); } .g-main { grid-template-columns: 1fr; }
  .learner-row { grid-template-columns: 1fr 1fr 1fr; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 60; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--border); justify-content: space-around; }
  .side .brand, .side .me, .side .spacer { display: none; }
  .nav { display: flex; width: 100%; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 6px 10px; }
  .nav a.active::before { display: none; }
  .nav a:hover { transform: none; }
  .main { padding-top: 18px; padding-bottom: 110px; }
  .mobile-bar { display: flex !important; }
  .auth { grid-template-columns: 1fr; } .auth-art { display: none; }
  .hero { grid-template-columns: 1fr; } .goal-hero { flex-direction: column; align-items: flex-start; }
  .toasts { bottom: 84px; right: 12px; }
}
.mobile-bar { display: none; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.mobile-bar .brand { padding: 0; font-size: 18px; } .mobile-bar .brand svg { width: 28px; height: 28px; } .mobile-bar .brand small { display: none; }
@media (max-width: 600px) {
  .g-4, .g-3, .g-2, .row { grid-template-columns: 1fr; }
  .g-4.kpis { grid-template-columns: 1fr 1fr; } .kpi { flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; }
  .learner-row { grid-template-columns: 1fr 1fr; }
  .card { padding: 18px; } .modal { padding: 20px; } .drawer { padding: 22px 18px; }
  .plan-item { grid-template-columns: auto 1fr; } .plan-item .mins { grid-column: 1 / -1; text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .reveal, .heat i { opacity: 1; }
}
