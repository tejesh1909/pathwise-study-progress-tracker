  <body>
    <div id="app" aria-live="polite"></div>
    <noscript>Pathwise needs JavaScript to run.</noscript>
    <script src="/shared/rules.js"></script>
    <script src="/shared/features.js"></script>
  <script>/* shared/rules.js */
/*
 * Pure domain rules for the Study Progress Tracker.
 * No I/O, no database, no DOM. Works in Node (server + tests) and the browser (offline preview).
 *
 * Everything the brief calls "core business logic" lives here:
 *   - prerequisite validation (self-reference + loop rejection, max prerequisites)
 *   - the unlock rule (a topic is locked until all prerequisites are complete)
 *   - re-locking when a topic is reopened (cascade or block, admin-configurable)
 *   - study-session validation (configurable min/max minutes, no future dates)
 *   - progress maths, streaks, weekly review and suggested study plan
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Rules = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ config */

  const DEFAULT_CONFIG = Object.freeze({
    minSessionMinutes: 5,
    maxSessionMinutes: 480,
    maxPrerequisitesPerTopic: 5,
    reopenPolicy: 'cascade', // 'cascade' = reopen dependents too, 'block' = refuse while dependents are complete
    weeklyTargetMinutes: 300,
    defaultTopicMinutes: 180, // used by deadline forecasts for topics with no estimate
  });

  const GOAL_COLORS = ['violet', 'cyan', 'mint', 'amber', 'rose', 'sky'];

  class RuleError extends Error {
    constructor(code, message, details) {
      super(message);
      this.name = 'RuleError';
      this.code = code; // VALIDATION | LOCKED | CONFLICT | FORBIDDEN | NOT_FOUND
      this.details = details || {};
    }
  }

  const isInt = (n) => typeof n === 'number' && Number.isInteger(n);

  /** Validates admin-supplied configuration and returns a complete, normalised config object. */
  function validateConfig(input, base) {
    const merged = Object.assign({}, DEFAULT_CONFIG, base || {}, input || {});
    const fields = {};
    const num = (k) => (typeof merged[k] === 'string' && merged[k].trim() !== '' ? Number(merged[k]) : merged[k]);
    const cfg = {
      minSessionMinutes: num('minSessionMinutes'),
      maxSessionMinutes: num('maxSessionMinutes'),
      maxPrerequisitesPerTopic: num('maxPrerequisitesPerTopic'),
      reopenPolicy: merged.reopenPolicy,
      weeklyTargetMinutes: num('weeklyTargetMinutes'),
      defaultTopicMinutes: num('defaultTopicMinutes'),
    };
    if (!isInt(cfg.minSessionMinutes) || cfg.minSessionMinutes < 1 || cfg.minSessionMinutes > 1440)
      fields.minSessionMinutes = 'Whole number between 1 and 1440';
    if (!isInt(cfg.maxSessionMinutes) || cfg.maxSessionMinutes < 1 || cfg.maxSessionMinutes > 1440)
      fields.maxSessionMinutes = 'Whole number between 1 and 1440';
    if (!fields.minSessionMinutes && !fields.maxSessionMinutes && cfg.maxSessionMinutes < cfg.minSessionMinutes)
      fields.maxSessionMinutes = 'Must be at least the minimum';
    if (!isInt(cfg.maxPrerequisitesPerTopic) || cfg.maxPrerequisitesPerTopic < 0 || cfg.maxPrerequisitesPerTopic > 25)
      fields.maxPrerequisitesPerTopic = 'Whole number between 0 and 25';
    if (!['cascade', 'block'].includes(cfg.reopenPolicy)) fields.reopenPolicy = 'Must be "cascade" or "block"';
    if (!isInt(cfg.weeklyTargetMinutes) || cfg.weeklyTargetMinutes < 30 || cfg.weeklyTargetMinutes > 10080)
      fields.weeklyTargetMinutes = 'Whole number between 30 and 10080';
    if (!isInt(cfg.defaultTopicMinutes) || cfg.defaultTopicMinutes < 15 || cfg.defaultTopicMinutes > 6000)
      fields.defaultTopicMinutes = 'Whole number between 15 and 6000';
    if (Object.keys(fields).length) throw new RuleError('VALIDATION', 'Invalid settings', { fields });
    return cfg;
  }

  /* ------------------------------------------------------------------- dates */
  // All dates are plain "YYYY-MM-DD" strings; arithmetic is done in UTC days so DST never interferes.

  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const toDays = (s) => {
    const [y, m, d] = s.split('-').map(Number);
    return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  };
  const fromDays = (n) => new Date(n * 86400000).toISOString().slice(0, 10);
  const addDays = (s, n) => fromDays(toDays(s) + n);
  const diffDays = (a, b) => toDays(a) - toDays(b);
  const isRealDate = (s) => typeof s === 'string' && DATE_RE.test(s) && fromDays(toDays(s)) === s;

  /** Today's date in the given IANA time zone, as YYYY-MM-DD. */
  function todayInTz(tz, now) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: tz || 'UTC', year: 'numeric', month: '2-digit', day: '2-digit' }).format(
      now || new Date()
    );
  }

  /* ----------------------------------------------------------- topic helpers */

  const sid = (x) => String(x);
  const prereqsOf = (t) => (t.prerequisites || []).map(sid);
  const indexTopics = (topics) => new Map(topics.map((t) => [sid(t.id), t]));

  /**
   * The unlock rule. Returns { [topicId]: { state, missing: [prereqIds], locked } }.
   * state: 'complete' | 'locked' | 'pending' | 'in_progress' | 'available'
   * A topic is LOCKED while any of its prerequisites is not complete. Because this is derived from
   * the current completion flags every time, reopening a prerequisite automatically re-locks dependents.
   */
  function computeStates(topics, minutesByTopic) {
    const byId = indexTopics(topics);
    const mins = minutesByTopic || {};
    const out = {};
    for (const t of topics) {
      const missing = prereqsOf(t).filter((pid) => {
        const p = byId.get(pid);
        return p && !p.complete;
      });
      let state;
      if (t.complete) state = 'complete';
      else if (missing.length) state = 'locked';
      else if (t.pending) state = 'pending'; // submitted for mentor approval; dependents stay locked
      else state = (mins[sid(t.id)] || 0) > 0 ? 'in_progress' : 'available';
      out[sid(t.id)] = { state, missing, locked: state === 'locked' };
    }
    return out;
  }

  /** Topics that list `topicId` as a direct prerequisite. */
  const directDependents = (topics, topicId) => topics.filter((t) => prereqsOf(t).includes(sid(topicId)));

  /** All topics that (transitively) depend on `topicId`. */
  function transitiveDependents(topics, topicId) {
    const seen = new Set();
    const queue = [sid(topicId)];
    while (queue.length) {
      const cur = queue.shift();
      for (const d of directDependents(topics, cur)) {
        if (!seen.has(sid(d.id))) {
          seen.add(sid(d.id));
          queue.push(sid(d.id));
        }
      }
    }
    return topics.filter((t) => seen.has(sid(t.id)));
  }

  /**
   * Would giving `topicId` the prerequisites `newPrereqs` create a loop?
   * Returns the offending path (array of ids, first === last) or null.
   */
  function findCyclePath(topics, topicId, newPrereqs) {
    const start = sid(topicId);
    const graph = new Map(topics.map((t) => [sid(t.id), prereqsOf(t)]));
    graph.set(start, newPrereqs.map(sid));
    const path = [start];
    const seen = new Set();
    const dfs = (node) => {
      for (const next of graph.get(node) || []) {
        if (next === start) {
          path.push(start);
          return true;
        }
        if (seen.has(next)) continue;
        seen.add(next);
        path.push(next);
        if (dfs(next)) return true;
        path.pop();
      }
      return false;
    };
    return dfs(start) ? path : null;
  }

  /**
   * Validates a prerequisite list for a topic. `topics` are the topics of the same goal.
   * `topicId` is null when the topic is being created (a brand-new node cannot form a loop).
   */
  function validatePrerequisites({ topics, topicId, prerequisites, config }) {
    const cfg = config || DEFAULT_CONFIG;
    const list = prerequisites == null ? [] : prerequisites;
    if (!Array.isArray(list)) throw new RuleError('VALIDATION', 'Prerequisites must be a list', { fields: { prerequisites: 'Must be a list' } });
    const ids = list.map(sid);
    const byId = indexTopics(topics);
    const fail = (msg, extra) => {
      throw new RuleError('VALIDATION', msg, Object.assign({ fields: { prerequisites: msg } }, extra));
    };
    if (new Set(ids).size !== ids.length) fail('Duplicate prerequisites are not allowed', { reason: 'duplicate' });
    if (topicId != null && ids.includes(sid(topicId))) fail('A topic cannot be its own prerequisite', { reason: 'self' });
    for (const id of ids) if (!byId.has(id)) fail('Every prerequisite must be a topic in the same goal', { reason: 'unknown' });
    if (ids.length > cfg.maxPrerequisitesPerTopic)
      fail(`A topic can have at most ${cfg.maxPrerequisitesPerTopic} prerequisite${cfg.maxPrerequisitesPerTopic === 1 ? '' : 's'}`, {
        reason: 'max',
        max: cfg.maxPrerequisitesPerTopic,
      });
    if (topicId != null) {
      const cycle = findCyclePath(topics, topicId, ids);
      if (cycle) {
        const names = cycle.map((id) => (byId.get(id) ? byId.get(id).title : id));
        fail(`That would create a loop: ${names.join(' → ')}`, { reason: 'cycle', path: cycle });
      }
    }
    return ids;
  }

  /**
   * Can this topic be marked complete? Throws LOCKED (with the missing prerequisites) if not.
   * With opts.needsApproval (mentor-assigned goals) the learner can only SUBMIT it: it becomes `pending`
   * and keeps its dependents locked until a mentor approves.
   */
  function planComplete(topics, topicId, opts) {
    const byId = indexTopics(topics);
    const t = byId.get(sid(topicId));
    if (!t) throw new RuleError('NOT_FOUND', 'Topic not found');
    if (t.complete) return { changed: [], pending: false };
    const needsApproval = !!(opts && opts.needsApproval);
    const st = computeStates(topics)[sid(t.id)];
    if (st.locked) {
      const missing = st.missing.map((id) => ({ id, title: byId.get(id).title }));
      throw new RuleError('LOCKED', `Locked — finish ${missing.map((m) => m.title).join(', ')} first`, { missing });
    }
    if (t.pending && needsApproval) return { changed: [], pending: true }; // already submitted
    return { changed: [sid(t.id)], pending: needsApproval };
  }

  function assertPending(topics, topicId) {
    const byId = indexTopics(topics);
    const t = byId.get(sid(topicId));
    if (!t) throw new RuleError('NOT_FOUND', 'Topic not found');
    if (t.complete) throw new RuleError('CONFLICT', 'This topic is already approved');
    if (!t.pending) throw new RuleError('CONFLICT', "Nothing to review — the learner hasn't submitted this topic");
    if (computeStates(topics)[sid(t.id)].locked) throw new RuleError('LOCKED', 'This topic is locked again — a prerequisite was reopened');
    return t;
  }
  /** Mentor approves a submitted topic: it becomes complete (and unlocks dependents). */
  function planApprove(topics, topicId) {
    return { changed: [sid(assertPending(topics, topicId).id)] };
  }
  /** Mentor sends a submitted topic back to the learner. */
  function planReject(topics, topicId) {
    return { changed: [sid(assertPending(topics, topicId).id)] };
  }

  /**
   * Reopening a topic re-locks everything that depends on it.
   * policy 'cascade': completed dependents are reopened too (so the invariant "complete ⇒ prerequisites complete" holds).
   * policy 'block'  : refuse while any dependent is complete.
   */
  function planReopen(topics, topicId, config) {
    const cfg = config || DEFAULT_CONFIG;
    const byId = indexTopics(topics);
    const t = byId.get(sid(topicId));
    if (!t) throw new RuleError('NOT_FOUND', 'Topic not found');
    if (!t.complete) return t.pending ? { reopened: [sid(t.id)], relocked: [] } : { reopened: [], relocked: [] }; // withdraw a submission
    const deps = transitiveDependents(topics, t.id);
    const completeDeps = deps.filter((d) => d.complete);
    const pendingDeps = deps.filter((d) => d.pending && !d.complete);
    if (cfg.reopenPolicy === 'block' && completeDeps.length) {
      throw new RuleError('CONFLICT', `Can't reopen — ${completeDeps.map((d) => d.title).join(', ')} already depend on it`, {
        blockedBy: completeDeps.map((d) => ({ id: sid(d.id), title: d.title })),
      });
    }
    return {
      reopened: [sid(t.id), ...completeDeps.map((d) => sid(d.id)), ...pendingDeps.map((d) => sid(d.id))],
      relocked: deps.map((d) => ({ id: sid(d.id), title: d.title })),
    };
  }

  /* ---------------------------------------------------------------- sessions */

  /** Validates a study session and returns the normalised values. */
  function validateSession({ input, topic, state, config, today }) {
    const cfg = config || DEFAULT_CONFIG;
    const fields = {};
    const i = input || {};
    const minutes = typeof i.minutes === 'string' && i.minutes.trim() !== '' ? Number(i.minutes) : i.minutes;
    const note = i.note == null ? '' : String(i.note).trim();
    if (!isRealDate(i.date)) fields.date = 'Pick a valid date';
    else if (today && i.date > today) fields.date = "Date can't be in the future";
    if (!isInt(minutes)) fields.minutes = 'Enter whole minutes';
    else if (minutes < cfg.minSessionMinutes || minutes > cfg.maxSessionMinutes)
      fields.minutes = `Minutes must be between ${cfg.minSessionMinutes} and ${cfg.maxSessionMinutes}`;
    if (note.length > 500) fields.note = 'Keep the note under 500 characters';
    const time = i.time == null ? '' : String(i.time).trim();
    if (time && !/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) fields.time = 'Use a time like 19:30';
    if (!topic) fields.topic = 'Choose a topic';
    if (Object.keys(fields).length) throw new RuleError('VALIDATION', 'Please fix the highlighted fields', { fields });
    if (state && state.locked) {
      throw new RuleError('LOCKED', 'This topic is still locked', { missing: state.missing });
    }
    return { date: i.date, minutes, note, time };
  }

  function validateGoalInput(input) {
    const fields = {};
    const title = String((input && input.title) || '').trim();
    const description = String((input && input.description) || '').trim();
    const color = (input && input.color) || 'violet';
    const targetDate = input && input.targetDate ? String(input.targetDate) : '';
    if (!title || title.length > 80) fields.title = 'Title is required (max 80 characters)';
    if (description.length > 500) fields.description = 'Max 500 characters';
    if (!GOAL_COLORS.includes(color)) fields.color = 'Unknown colour';
    if (targetDate && !isRealDate(targetDate)) fields.targetDate = 'Pick a valid date';
    if (Object.keys(fields).length) throw new RuleError('VALIDATION', 'Please fix the highlighted fields', { fields });
    return { title, description, color, targetDate };
  }

  /** Resource links: http(s) only (blocks javascript:, data: etc.), max 10, titles default to the host name. */
  function normalizeResources(list) {
    if (list == null || list === '') return [];
    const bad = (msg) => { throw new RuleError('VALIDATION', msg, { fields: { resources: msg } }); };
    if (!Array.isArray(list)) bad('Resources must be a list');
    if (list.length > 10) bad('Add at most 10 links');
    return list.map((r) => {
      const raw = String((r && r.url) || '').trim();
      let u;
      try { u = new URL(raw); } catch { bad(`"${raw.slice(0, 40)}" is not a valid link`); }
      if (!['http:', 'https:'].includes(u.protocol)) bad('Links must start with http:// or https://');
      if (raw.length > 300) bad('A link is too long (max 300 characters)');
      const title = String((r && r.title) || '').trim().slice(0, 80) || u.hostname.replace(/^www\./, '');
      return { title, url: u.href };
    });
  }

  function validateTopicInput(input) {
    const fields = {};
    const i = input || {};
    const title = String(i.title || '').trim();
    const description = String(i.description || '').trim();
    const notes = String(i.notes || '').trim();
    let est = i.estimateMinutes;
    if (est === undefined || est === null || est === '') est = 0;
    if (typeof est === 'string') est = Number(est);
    if (!title || title.length > 80) fields.title = 'Title is required (max 80 characters)';
    if (description.length > 500) fields.description = 'Max 500 characters';
    if (notes.length > 2000) fields.notes = 'Keep notes under 2000 characters';
    if (!isInt(est) || est < 0 || est > 36000) fields.estimateMinutes = 'Whole minutes between 0 and 36000 (600 hours)';
    let resources = [];
    try { resources = normalizeResources(i.resources); } catch (e) { fields.resources = (e.details && e.details.fields && e.details.fields.resources) || e.message; }
    if (Object.keys(fields).length) throw new RuleError('VALIDATION', 'Please fix the highlighted fields', { fields });
    return { title, description, notes, estimateMinutes: est, resources };
  }

  /* ---------------------------------------------------------------- progress */

  function minutesByTopic(sessions) {
    const out = {};
    for (const s of sessions) out[sid(s.topicId)] = (out[sid(s.topicId)] || 0) + s.minutes;
    return out;
  }

  /** Per-goal progress: percent of topics complete, total minutes, minutes per topic. */
  function goalProgress(topics, sessions) {
    const total = topics.length;
    const done = topics.filter((t) => t.complete).length;
    const mins = minutesByTopic(sessions);
    return {
      totalTopics: total,
      completeTopics: done,
      percent: total ? Math.round((done / total) * 100) : 0,
      totalMinutes: sessions.reduce((a, s) => a + s.minutes, 0),
      minutesByTopic: mins,
    };
  }

  /** Six rolling 7-day buckets ending today (oldest first). */
  function weeklySeries(sessions, today, weeks) {
    const n = weeks || 6;
    const buckets = [];
    for (let i = n - 1; i >= 0; i--) {
      const end = addDays(today, -7 * i);
      buckets.push({ start: addDays(end, -6), end, minutes: 0, sessions: 0 });
    }
    for (const s of sessions) {
      const b = buckets.find((x) => s.date >= x.start && s.date <= x.end);
      if (b) {
        b.minutes += s.minutes;
        b.sessions += 1;
      }
    }
    return buckets;
  }

  /** Minutes per day for the last `days` days (oldest first). */
  function heatmap(sessions, today, days) {
    const n = days || 42;
    const by = {};
    for (const s of sessions) by[s.date] = (by[s.date] || 0) + s.minutes;
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = addDays(today, -i);
      out.push({ date: d, minutes: by[d] || 0 });
    }
    return out;
  }

  /** Consecutive study days ending today (or yesterday, so an unfinished day doesn't break a streak). */
  function streak(sessions, today) {
    const days = new Set(sessions.map((s) => s.date));
    let d = days.has(today) ? today : addDays(today, -1);
    let n = 0;
    while (days.has(d)) {
      n++;
      d = addDays(d, -1);
    }
    return n;
  }

  /* ---------------------------------------------------------------- insights */

  function lastStudied(sessions) {
    const out = {};
    for (const s of sessions) if (!out[sid(s.topicId)] || s.date > out[sid(s.topicId)]) out[sid(s.topicId)] = s.date;
    return out;
  }

  /** Deterministic weekly review: everything needed to write (or have an AI write) the narrative. */
  function buildReview({ topics, sessions, config, today }) {
    const cfg = config || DEFAULT_CONFIG;
    const from = addDays(today, -6);
    const prevFrom = addDays(today, -13);
    const prevTo = addDays(today, -7);
    const cur = sessions.filter((s) => s.date >= from && s.date <= today);
    const prev = sessions.filter((s) => s.date >= prevFrom && s.date <= prevTo);
    const minutes = cur.reduce((a, s) => a + s.minutes, 0);
    const previousMinutes = prev.reduce((a, s) => a + s.minutes, 0);
    const byId = indexTopics(topics);
    const perTopic = minutesByTopic(cur);
    const topTopics = Object.entries(perTopic)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3)
      .map(([id, m]) => ({ id, title: byId.get(id) ? byId.get(id).title : 'Removed topic', minutes: m }));
    const completed = topics.filter((t) => t.complete && t.completedOn && t.completedOn >= from && t.completedOn <= today).map((t) => t.title);
    const states = computeStates(topics, minutesByTopic(sessions));
    const last = lastStudied(sessions);
    const stalled = topics
      .filter((t) => states[sid(t.id)].state === 'in_progress' && last[sid(t.id)] && diffDays(today, last[sid(t.id)]) >= 7)
      .map((t) => ({ title: t.title, daysSince: diffDays(today, last[sid(t.id)]) }));
    const unlocked = topics.filter((t) => states[sid(t.id)].state === 'available').map((t) => t.title);
    const deltaPercent = previousMinutes ? Math.round(((minutes - previousMinutes) / previousMinutes) * 100) : null;
    return {
      period: { from, to: today },
      minutes,
      previousMinutes,
      deltaPercent,
      sessions: cur.length,
      activeDays: new Set(cur.map((s) => s.date)).size,
      targetMinutes: cfg.weeklyTargetMinutes,
      targetPercent: Math.round((minutes / cfg.weeklyTargetMinutes) * 100),
      streak: streak(sessions, today),
      topTopics,
      completed,
      stalled,
      readyToStart: unlocked,
    };
  }

  const fmtMin = (m) => (m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : `${m}m`);

  /** Template narrative used when no LLM is configured. Honest and deterministic. */
  function narrate(r, name) {
    const who = name ? name.split(' ')[0] : 'You';
    const lines = [];
    if (!r.sessions) {
      lines.push(`${who === 'You' ? 'You' : who} didn't log any study time in the last 7 days. A single 25-minute session today is enough to restart the streak.`);
    } else {
      let l = `${who === 'You' ? 'You' : who} studied ${fmtMin(r.minutes)} across ${r.sessions} session${r.sessions === 1 ? '' : 's'} on ${r.activeDays} day${r.activeDays === 1 ? '' : 's'} — ${r.targetPercent}% of the ${fmtMin(r.targetMinutes)} weekly target`;
      if (r.deltaPercent != null) l += `, ${r.deltaPercent >= 0 ? 'up' : 'down'} ${Math.abs(r.deltaPercent)}% on the previous week`;
      lines.push(l + '.');
    }
    if (r.completed.length) lines.push(`Finished: ${r.completed.join(', ')}.`);
    if (r.topTopics.length) lines.push(`Most time went into ${r.topTopics[0].title} (${fmtMin(r.topTopics[0].minutes)}).`);
    if (r.stalled.length) lines.push(`${r.stalled[0].title} has gone quiet for ${r.stalled[0].daysSince} days — worth a short revisit.`);
    if (r.streak >= 3) lines.push(`You're on a ${r.streak}-day streak. Keep it alive.`);
    return lines.join(' ');
  }

  /**
   * Suggested study plan for the next 7 days. Only unlocked topics are ever suggested.
   * Priority: topics already in progress, then topics that unlock the most dependents, then the least recently studied.
   */
  function suggestPlan({ topics, sessions, config, today, maxItems }) {
    const cfg = config || DEFAULT_CONFIG;
    const states = computeStates(topics, minutesByTopic(sessions));
    const last = lastStudied(sessions);
    const candidates = topics
      .filter((t) => ['available', 'in_progress'].includes(states[sid(t.id)].state))
      .map((t) => {
        const deps = directDependents(topics, t.id);
        // dependents that would become unlocked the moment this topic is completed
        const unlocks = deps.filter((d) => {
          if (d.complete) return false;
          const others = prereqsOf(d).filter((p) => p !== sid(t.id));
          return others.every((p) => (topics.find((x) => sid(x.id) === p) || {}).complete);
        });
        const since = last[sid(t.id)] ? Math.min(diffDays(today, last[sid(t.id)]), 14) : 14;
        const inProg = states[sid(t.id)].state === 'in_progress';
        return { t, unlocks, inProg, since, score: (inProg ? 100 : 0) + unlocks.length * 10 + deps.length + since / 14 };
      })
      .sort((a, b) => b.score - a.score)
      .slice(0, maxItems || 4);
    if (!candidates.length) return { targetMinutes: cfg.weeklyTargetMinutes, items: [] };
    const each = Math.round(cfg.weeklyTargetMinutes / candidates.length / 5) * 5;
    const clamp = (m) => Math.max(cfg.minSessionMinutes, Math.min(cfg.maxSessionMinutes, m));
    const items = candidates.map((c, idx) => {
      let reason;
      if (c.inProg && c.unlocks.length) reason = `Already underway, and finishing it unlocks ${c.unlocks.map((u) => u.title).join(', ')}.`;
      else if (c.inProg) reason = last[sid(c.t.id)] ? `Already underway — last studied ${diffDays(today, last[sid(c.t.id)])} days ago.` : 'Already underway.';
      else if (c.unlocks.length) reason = `Ready to start, and it unlocks ${c.unlocks.map((u) => u.title).join(', ')}.`;
      else reason = 'Unlocked and ready to start.';
      return {
        topicId: sid(c.t.id),
        goalId: c.t.goalId != null ? sid(c.t.goalId) : null,
        title: c.t.title,
        state: states[sid(c.t.id)].state,
        minutes: clamp(idx === 0 ? cfg.weeklyTargetMinutes - each * (candidates.length - 1) : each),
        unlocks: c.unlocks.map((u) => u.title),
        reason,
      };
    });
    return { targetMinutes: cfg.weeklyTargetMinutes, items };
  }

  return {
    DEFAULT_CONFIG,
    GOAL_COLORS,
    RuleError,
    validateConfig,
    todayInTz,
    isRealDate,
    addDays,
    diffDays,
    computeStates,
    directDependents,
    transitiveDependents,
    findCyclePath,
    validatePrerequisites,
    planComplete,
    planApprove,
    planReject,
    planReopen,
    normalizeResources,
    validateSession,
    validateGoalInput,
    validateTopicInput,
    minutesByTopic,
    goalProgress,
    weeklySeries,
    heatmap,
    streak,
    buildReview,
    narrate,
    suggestPlan,
  };
});

</script>
<script>/* shared/features.js */
/*
 * Feature logic that sits on top of shared/rules.js. Pure functions, no I/O, usable in Node and in the browser preview.
 *   - goalForecast        deadline forecast from estimates + recent pace
 *   - habits / suggestSchedule   "smarter plans": when you actually study, turned into a 7-day schedule
 *   - roadmap             sanitise (AI or template) roadmaps: loop-free, topologically ordered, limits enforced
 *   - quiz                sanitise generated quizzes, plus a no-AI self-check fallback
 *   - coach               progress context + a rule-based fallback coach
 *   - CSV                 export with spreadsheet-formula injection protection
 * Anything that can come from an AI model is validated here before it is trusted.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./rules'));
  else root.Features = factory(root.Rules);
})(typeof self !== 'undefined' ? self : this, function (R) {
  'use strict';
  const { RuleError } = R;

  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtMin = (m) => {
    m = Math.round(m || 0);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60);
    return m % 60 ? `${h}h ${m % 60}m` : `${h}h`;
  };
  const fmtDate = (s) => {
    const [, m, d] = s.split('-').map(Number);
    return `${d} ${MONTHS[m - 1]}`;
  };
  const weekdayOf = (d) => {
    const [y, m, dd] = d.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, dd)).getUTCDay();
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  /* ============================================================ deadline forecast */

  /**
   * Will this goal be finished by its target date?
   *   remaining work = Σ over unfinished topics of (estimate − minutes already logged); topics without an estimate use the
   *   average of the goal's estimated topics (or the configured default) and are counted in `assumedTopics`.
   *   pace = minutes logged for this goal in the last 28 days ÷ 4.
   * status: done | empty | no_target | on_track | at_risk (≤14 days late) | behind | stalled (no recent study) | overdue
   */
  function goalForecast({ goal, topics, sessions, config, today }) {
    const cfg = config || R.DEFAULT_CONFIG;
    const target = (goal && goal.targetDate) || '';
    const logged = R.minutesByTopic(sessions);
    const known = topics.filter((t) => t.estimateMinutes > 0);
    const avgKnown = known.length ? Math.round(known.reduce((a, t) => a + t.estimateMinutes, 0) / known.length) : cfg.defaultTopicMinutes;
    const est = (t) => (t.estimateMinutes > 0 ? t.estimateMinutes : avgKnown);
    const open = topics.filter((t) => !t.complete);
    const remaining = open.reduce((a, t) => a + (t.pending ? 0 : Math.max(0, est(t) - (logged[String(t.id)] || 0))), 0);
    const since = R.addDays(today, -27);
    const recent = sessions.filter((s) => s.date >= since && s.date <= today).reduce((a, s) => a + s.minutes, 0);
    const pace = Math.round(recent / 4);
    const out = {
      targetDate: target,
      remainingMinutes: remaining,
      totalEstimateMinutes: topics.reduce((a, t) => a + est(t), 0),
      loggedMinutes: sessions.reduce((a, s) => a + s.minutes, 0),
      assumedTopics: open.filter((t) => !(t.estimateMinutes > 0)).length,
      paceMinutesPerWeek: pace,
      projectedDate: null,
      slackDays: null,
      requiredMinutesPerWeek: null,
    };
    if (!topics.length) return { ...out, status: 'empty', headline: 'Add topics to get a forecast.' };
    if (!open.length) return { ...out, status: 'done', headline: 'Goal complete.' };

    const projected = remaining === 0 ? today : pace > 0 ? R.addDays(today, Math.ceil((remaining / pace) * 7)) : null;
    out.projectedDate = projected;
    const daysLeft = target ? R.diffDays(target, today) : null;
    if (target && daysLeft > 0) out.requiredMinutesPerWeek = Math.ceil(remaining / (daysLeft / 7));
    out.slackDays = target && projected ? R.diffDays(target, projected) : null;

    const left = fmtMin(remaining);
    const need = out.requiredMinutesPerWeek ? fmtMin(out.requiredMinutesPerWeek) + '/week' : '';
    let status, headline;
    if (!target) {
      status = 'no_target';
      headline = projected ? `About ${left} left — around ${fmtDate(projected)} at your current pace. Set a target date to track it.` : `About ${left} left. Log a few sessions to see a projected finish.`;
    } else if (daysLeft <= 0) {
      status = 'overdue';
      headline = daysLeft === 0 ? `Target is today and ${left} of work is still open.` : `Target date passed ${plural(-daysLeft, 'day')} ago with ${left} still to go.`;
    } else if (remaining === 0) {
      status = 'on_track';
      headline = 'All the study time is in — mark the remaining topics complete.';
    } else if (pace === 0) {
      status = 'stalled';
      headline = `Nothing logged in the last 4 weeks. ${left} left — about ${need} would still make ${fmtDate(target)}.`;
    } else if (out.slackDays >= 0) {
      status = 'on_track';
      headline = out.slackDays === 0 ? `On pace to finish on ${fmtDate(target)}, right on your target.` : `On pace to finish ${fmtDate(projected)}, ${plural(out.slackDays, 'day')} before your ${fmtDate(target)} target.`;
    } else if (out.slackDays >= -14) {
      status = 'at_risk';
      headline = `At this pace you'd finish ${fmtDate(projected)}, ${plural(-out.slackDays, 'day')} after your ${fmtDate(target)} target. About ${need} gets you there.`;
    } else {
      status = 'behind';
      headline = `At this pace you'd finish ${fmtDate(projected)}, ${plural(-out.slackDays, 'day')} after your ${fmtDate(target)} target. You'd need about ${need} (now ${fmtMin(pace)}/week).`;
    }
    return { ...out, status, headline };
  }
  const WARNING_STATUSES = ['at_risk', 'behind', 'stalled', 'overdue'];

  /* ============================================================ habits + smart schedule */

  const median = (a) => {
    if (!a.length) return null;
    const s = [...a].sort((x, y) => x - y);
    const m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  const toHHMM = (mins) => {
    const m = (Math.round(mins / 15) * 15) % 1440;
    return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  };
  const partOfDay = (hhmm) => { const h = Number(hhmm.slice(0, 2)); return h < 5 ? 'late night' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'night'; };

  /** What the last 8 weeks say about when this learner really studies. */
  function habits(sessions, today) {
    const from = R.addDays(today, -55);
    const recent = sessions.filter((s) => s.date >= from && s.date <= today);
    const days = new Set(recent.map((s) => s.date));
    const base = { enough: false, studyDaysPerWeek: null, preferredWeekdays: [], startWeekday: '18:30', startWeekend: '10:00', typicalMinutes: 45, bestDay: null, partOfDay: 'evening', minutesByWeekday: Array(7).fill(0), timedSessions: 0 };
    if (recent.length < 4 || days.size < 3) return base;
    const perDow = Array(7).fill(0);
    days.forEach((d) => perDow[weekdayOf(d)]++);
    const minutesByWeekday = Array(7).fill(0);
    recent.forEach((s) => (minutesByWeekday[weekdayOf(s.date)] += s.minutes));
    const maxC = Math.max(...perDow);
    const preferred = perDow
      .map((c, i) => [c, i])
      .filter(([c]) => c >= Math.max(1, Math.ceil(maxC * 0.5)))
      .sort((a, b) => b[0] - a[0] || a[1] - b[1])
      .slice(0, 4)
      .map((x) => x[1])
      .sort((a, b) => a - b);
    const timed = recent.filter((s) => s.time);
    const wkd = timed.filter((s) => ![0, 6].includes(weekdayOf(s.date))).map((s) => toMin(s.time));
    const wke = timed.filter((s) => [0, 6].includes(weekdayOf(s.date))).map((s) => toMin(s.time));
    const all = timed.map((s) => toMin(s.time));
    const overall = median(all);
    const startWeekday = toHHMM(median(wkd) ?? overall ?? 18.5 * 60);
    const startWeekend = toHHMM(median(wke) ?? overall ?? 10 * 60);
    const typical = Math.round(median(recent.map((s) => s.minutes)) / 5) * 5;
    return {
      enough: true,
      studyDaysPerWeek: Math.round((days.size / 8) * 10) / 10,
      preferredWeekdays: preferred,
      startWeekday,
      startWeekend,
      typicalMinutes: Math.max(15, typical),
      bestDay: DAYS[perDow.indexOf(maxC)],
      partOfDay: partOfDay(overall != null ? toHHMM(overall) : '18:30'),
      minutesByWeekday,
      timedSessions: timed.length,
    };
  }

  /**
   * A 7-day schedule built from the weekly plan and the learner's own habits: study on the weekdays they usually study,
   * at their usual start time, in sessions about as long as their usual session. Only unlocked topics are ever scheduled.
   */
  function suggestSchedule({ topics, sessions, config, today }) {
    const cfg = config || R.DEFAULT_CONFIG;
    const plan = R.suggestPlan({ topics, sessions, config: cfg, today, maxItems: 4 });
    const hab = habits(sessions, today);
    const basis = hab.enough ? 'habits' : 'defaults';
    if (!plan.items.length) return { habits: hab, slots: [], targetMinutes: plan.targetMinutes, basis };
    const clamp = (m) => Math.max(cfg.minSessionMinutes, Math.min(cfg.maxSessionMinutes, m));
    const typical = clamp(hab.typicalMinutes);
    const need = Math.max(1, Math.min(7, Math.round(plan.targetMinutes / typical)));
    const week = Array.from({ length: 7 }, (_, i) => { const date = R.addDays(today, i); return { date, dow: weekdayOf(date) }; });
    const preferredDows = hab.enough ? hab.preferredWeekdays : [1, 3, 5, 6];
    let chosen = week.filter((w) => preferredDows.includes(w.dow)).slice(0, need);
    if (chosen.length < need) {
      const rest = week.filter((w) => !chosen.includes(w)).sort((a, b) => hab.minutesByWeekday[b.dow] - hab.minutesByWeekday[a.dow] || (a.date < b.date ? -1 : 1));
      chosen = chosen.concat(rest.slice(0, need - chosen.length));
    }
    chosen.sort((a, b) => (a.date < b.date ? -1 : 1));
    const perSlot = clamp(Math.round(plan.targetMinutes / chosen.length / 5) * 5);
    const left = Object.fromEntries(plan.items.map((i) => [i.topicId, i.minutes]));
    const slots = chosen.map((w) => {
      const pick = plan.items.slice().sort((a, b) => left[b.topicId] - left[a.topicId] || plan.items.indexOf(a) - plan.items.indexOf(b))[0];
      left[pick.topicId] -= perSlot;
      const weekend = [0, 6].includes(w.dow);
      return { date: w.date, weekday: DAYS[w.dow], time: weekend ? hab.startWeekend : hab.startWeekday, minutes: perSlot, topicId: pick.topicId, goalId: pick.goalId, title: pick.title, reason: pick.reason };
    });
    return { habits: hab, slots, targetMinutes: plan.targetMinutes, basis };
  }

  /* ============================================================ roadmaps */

  // [title, hours, [prerequisite indices]] — used when no AI key is configured.
  const TEMPLATES = [
    { match: /\brust\b/i, name: 'Rust', description: 'From cargo basics to ownership, traits and a finished CLI tool.', topics: [
      ['Tooling: rustup, Cargo and project layout', 3, []], ['Syntax, types and control flow', 6, [0]], ['Ownership and borrowing', 10, [1]],
      ['Structs, enums and pattern matching', 8, [1]], ['Error handling with Result and Option', 6, [2, 3]], ['Collections, iterators and closures', 8, [3]],
      ['Traits and generics', 10, [4, 5]], ['Lifetimes', 8, [2, 6]], ['Concurrency and async basics', 10, [6, 7]], ['Capstone: build a CLI tool', 15, [4, 8]] ] },
    { match: /\bpython\b/i, name: 'Python', description: 'Core Python, then the standard toolkit and a real project.', topics: [
      ['Setup, syntax and basic types', 4, []], ['Control flow and functions', 5, [0]], ['Lists, dicts, sets and tuples', 6, [1]],
      ['Files, errors and modules', 5, [1]], ['Object-oriented Python', 8, [2, 3]], ['Virtual environments and packages', 3, [3]],
      ['Testing with pytest', 5, [4]], ['Working with APIs and data', 8, [4, 5]], ['Capstone project', 14, [6, 7]] ] },
    { match: /(javascript|web dev|frontend|front-end|full.?stack|html|css|node|react)/i, name: 'Web development', description: 'HTML, CSS and JavaScript through to a deployed full-stack app.', topics: [
      ['HTML and semantic markup', 4, []], ['CSS layout and responsive design', 8, [0]], ['JavaScript fundamentals', 10, [0]],
      ['The DOM and events', 6, [2]], ['Async JavaScript and fetch', 6, [3]], ['Node and Express', 8, [2]], ['Databases and data modelling', 8, [5]],
      ['Authentication and security', 8, [5, 6]], ['Deploy a full-stack project', 12, [1, 4, 7]] ] },
    { match: /(sql|database|postgres|mysql)/i, name: 'SQL and databases', description: 'Query fluently, design schemas and make them fast.', topics: [
      ['SELECT, filtering and sorting', 4, []], ['Joins', 5, [0]], ['Aggregation and GROUP BY', 5, [0]], ['Subqueries and CTEs', 6, [1, 2]],
      ['Schema design and normalisation', 6, [1]], ['Indexes and query plans', 6, [4]], ['Transactions and isolation', 5, [4]], ['Window functions', 6, [3]], ['Project: design and query a real dataset', 12, [5, 6, 7]] ] },
    { match: /(data structures|dsa|algorithms|leetcode|coding interview)/i, name: 'Data structures and algorithms', description: 'Complexity, core structures and the patterns interviews test.', topics: [
      ['Big-O and complexity', 3, []], ['Arrays and strings', 6, [0]], ['Hash maps and sets', 5, [1]], ['Linked lists, stacks and queues', 7, [1]],
      ['Recursion and backtracking', 6, [3]], ['Trees and graphs', 10, [3, 4]], ['Sorting and searching', 6, [1]], ['Dynamic programming', 12, [4, 6]], ['Mock interviews and review', 10, [5, 7]] ] },
    { match: /(machine learning|\bml\b|deep learning|data science|\bai\b)/i, name: 'Machine learning', description: 'Math and Python foundations through to evaluated, explainable models.', topics: [
      ['Python, NumPy and pandas', 8, []], ['Probability and statistics', 8, []], ['Linear and logistic regression', 8, [0, 1]], ['Trees and ensembles', 8, [2]],
      ['Model evaluation and validation', 6, [2]], ['Feature engineering', 6, [0, 4]], ['Neural network basics', 10, [2]], ['Explainability and error analysis', 5, [3, 4]], ['Capstone: an end-to-end model', 15, [5, 6, 7]] ] },
    { match: /(devops|cloud|docker|kubernetes|aws|azure|gcp)/i, name: 'Cloud and DevOps', description: 'Linux, containers, pipelines and running things in the cloud.', topics: [
      ['Linux and the shell', 6, []], ['Git and collaboration', 4, []], ['Networking essentials', 5, [0]], ['Docker and containers', 8, [0]], ['CI/CD pipelines', 7, [1, 3]],
      ['Cloud compute, storage and IAM', 8, [2]], ['Infrastructure as code', 8, [5]], ['Kubernetes basics', 10, [3, 5]], ['Monitoring and incident basics', 6, [4, 7]] ] },
    { match: /(marketing|seo|brand|growth)/i, name: 'Digital marketing', description: 'Strategy, channels and measurement for a campaign you can run.', topics: [
      ['Marketing fundamentals', 4, []], ['Audience and market research', 5, [0]], ['Positioning and messaging', 4, [1]], ['Content and SEO', 8, [2]], ['Social media', 6, [2]],
      ['Email and lifecycle marketing', 5, [2]], ['Paid advertising', 6, [3, 4]], ['Analytics and reporting', 6, [3, 5]], ['Capstone: plan and launch a campaign', 12, [6, 7]] ] },
  ];
  const LEVEL = { beginner: 1, intermediate: 0.75, advanced: 0.6 };

  const subjectFrom = (text) => String(text || '').replace(/^\s*(i want to\s+)?(learn|master|study|understand|get good at|become (a|an)?|get into)\s+/i, '').replace(/[.!?]+$/, '').trim() || 'this subject';
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  /** Offline roadmap: a curated template when the subject matches one, otherwise a generic learning arc. */
  function fallbackRoadmap({ subject, level }) {
    const subj = subjectFrom(subject);
    const mult = LEVEL[level] || 1;
    const tpl = TEMPLATES.find((t) => t.match.test(subj));
    let rows, title, description, source;
    if (tpl) {
      rows = tpl.topics;
      title = `Learn ${tpl.name}`;
      description = tpl.description;
      source = 'template';
    } else {
      const S = cap(subj);
      rows = [
        [`${S}: foundations and vocabulary`, 3, []], [`${S}: core concepts`, 6, [0]], [`${S}: tools and workflow`, 4, [0]], [`Hands-on basics in ${subj}`, 6, [1, 2]],
        [`Intermediate techniques in ${subj}`, 8, [3]], [`Common pitfalls and best practices`, 4, [3]], [`A practice project in ${subj}`, 10, [4, 5]], [`Advanced topics in ${subj}`, 8, [4]], [`Capstone: show what you can do with ${subj}`, 12, [6, 7]],
      ];
      title = `Learn ${subj}`;
      description = `A general learning path for ${subj}. Rename and reshape the topics to fit exactly what you need.`;
      source = 'generic';
    }
    const topics = rows.map(([t, h, p], i) => ({ key: `t${i + 1}`, title: t, description: '', estimateMinutes: Math.max(30, Math.round((h * 60 * mult) / 15) * 15), prerequisites: p.map((x) => `t${x + 1}`) }));
    return { title: title.slice(0, 80), description, topics, source };
  }

  /**
   * Validates a roadmap no matter where it came from (AI, template, or the editor): drops unknown/self/duplicate prerequisites,
   * enforces the configured prerequisite limit, removes any edge that would close a loop, clamps estimates, and returns the
   * topics ordered so every prerequisite comes before its dependents.
   */
  function sanitizeRoadmap(raw, config) {
    const cfg = config || R.DEFAULT_CONFIG;
    const list = Array.isArray(raw && raw.topics) ? raw.topics : [];
    const used = new Set();
    const topics = [];
    list.slice(0, 24).forEach((t, i) => {
      const title = String((t && t.title) || '').trim().slice(0, 80);
      if (!title) return;
      let key = String(t.key != null ? t.key : `t${i + 1}`).trim().slice(0, 40) || `t${i + 1}`;
      if (used.has(key)) key = `${key}_${i}`;
      used.add(key);
      let minutes = Number(t.estimateMinutes != null ? t.estimateMinutes : t.hours != null ? t.hours * 60 : 0);
      minutes = Number.isFinite(minutes) ? Math.min(6000, Math.max(0, Math.round(minutes / 5) * 5)) : 0;
      topics.push({ key, title, description: String(t.description || '').trim().slice(0, 300), estimateMinutes: minutes, prerequisites: Array.isArray(t.prerequisites) ? t.prerequisites.map(String) : [] });
    });
    if (topics.length < 2) throw new RuleError('VALIDATION', 'A roadmap needs at least two topics', { fields: { topics: 'Add at least two topics' } });
    const keys = new Set(topics.map((t) => t.key));
    const graph = topics.map((t) => ({ id: t.key, title: t.title, prerequisites: [] }));
    const node = new Map(graph.map((g) => [g.id, g]));
    topics.forEach((t) => {
      const kept = [];
      for (const p of [...new Set(t.prerequisites)]) {
        if (p === t.key || !keys.has(p)) continue;
        if (kept.length >= cfg.maxPrerequisitesPerTopic) break;
        if (R.findCyclePath(graph, t.key, [...kept, p])) continue; // would close a loop — drop this edge
        kept.push(p);
        node.get(t.key).prerequisites = kept.slice();
      }
      t.prerequisites = kept;
    });
    const ordered = [];
    const placed = new Set();
    let rest = topics.slice();
    while (rest.length) {
      const next = rest.filter((t) => t.prerequisites.every((p) => placed.has(p)));
      if (!next.length) break; // unreachable: loops were removed above
      next.forEach((t) => { ordered.push(t); placed.add(t.key); });
      rest = rest.filter((t) => !placed.has(t.key));
    }
    return { title: String((raw && raw.title) || '').trim().slice(0, 80), description: String((raw && raw.description) || '').trim().slice(0, 500), topics: ordered };
  }

  /* ============================================================ quizzes */

  /** Keeps only well-formed multiple-choice questions (4+ valid ones needed to be useful, at least 3). */
  function sanitizeQuiz(raw) {
    const qs = (Array.isArray(raw && raw.questions) ? raw.questions : [])
      .map((q) => {
        const options = (Array.isArray(q && q.options) ? q.options : []).map((o) => String(o).trim().slice(0, 200)).filter(Boolean).slice(0, 5);
        const ans = Number(q && q.answerIndex);
        const question = String((q && q.question) || '').trim().slice(0, 300);
        if (!question || options.length < 2 || !Number.isInteger(ans) || ans < 0 || ans >= options.length) return null;
        return { question, options, answerIndex: ans, explanation: String((q && q.explanation) || '').trim().slice(0, 300) };
      })
      .filter(Boolean)
      .slice(0, 8);
    if (qs.length < 3) throw new RuleError('VALIDATION', 'The generated quiz was not usable');
    return { kind: 'mcq', questions: qs };
  }

  /** Without an AI key we can't invent factual questions, so give honest recall prompts built from the topic itself. */
  function fallbackQuiz(topic, prereqTitles) {
    const t = topic.title;
    const prompts = [
      `Explain "${t}" in your own words, as if teaching a beginner.`,
      `Give one example where "${t}" applies and one where it does not.`,
      prereqTitles && prereqTitles.length ? `Which ideas from ${prereqTitles.join(', ')} does "${t}" rely on?` : `What would you need to know before starting "${t}", and why?`,
      `What mistake is a beginner most likely to make with "${t}"?`,
      topic.notes ? `Pick the part of your notes on "${t}" you're least sure about and re-explain it without looking.` : `Write down one question about "${t}" you still can't answer.`,
    ];
    return { kind: 'prompts', questions: prompts.map((p) => ({ prompt: p })) };
  }

  /* ============================================================ coach */

  /** The facts the coach (AI or rule-based) is allowed to talk about. */
  function buildCoachContext({ name, goals, topics, sessions, config, today }) {
    const states = R.computeStates(topics, R.minutesByTopic(sessions));
    const review = R.buildReview({ topics, sessions, config, today });
    const plan = R.suggestPlan({ topics, sessions, config, today });
    const title = (list, id) => (list.find((x) => x.id === id) || {}).title;
    return {
      name,
      today,
      week: { minutes: review.minutes, targetMinutes: review.targetMinutes, targetPercent: review.targetPercent, sessions: review.sessions, activeDays: review.activeDays, streak: review.streak, completed: review.completed, stalled: review.stalled },
      plan: plan.items.map((i) => ({ title: i.title, minutes: i.minutes, reason: i.reason })),
      goals: goals.map((g) => {
        const gt = topics.filter((t) => t.goalId === g.id);
        const gs = sessions.filter((s) => s.goalId === g.id);
        const f = goalForecast({ goal: g, topics: gt, sessions: gs, config, today });
        return {
          title: g.title,
          targetDate: g.targetDate || null,
          percent: R.goalProgress(gt, gs).percent,
          forecast: { status: f.status, headline: f.headline },
          locked: gt.filter((t) => states[t.id].state === 'locked').map((t) => ({ title: t.title, needs: states[t.id].missing.map((id) => title(gt, id)) })),
          ready: gt.filter((t) => ['available', 'in_progress'].includes(states[t.id].state)).map((t) => t.title),
          awaitingApproval: gt.filter((t) => states[t.id].state === 'pending').map((t) => t.title),
        };
      }),
    };
  }

  const COACH_CHIPS = ['What should I study next?', 'Am I on track for my deadlines?', "What's still locked?", 'How was my week?'];

  /** Rule-based coach used when no AI key is set. It answers from the same facts, and says so when it can't help. */
  function coachFallback(message, ctx) {
    const q = String(message || '').toLowerCase();
    const bullets = (a) => a.map((x) => `• ${x}`).join('\n');
    const first = (ctx.name || '').split(' ')[0] || 'there';
    if (/(locked|unlock|blocked|stuck on|can'?t start|prerequisite|why can)/.test(q)) {
      const all = ctx.goals.flatMap((g) => g.locked.map((l) => `${l.title} (${g.title}) needs ${l.needs.join(' and ')}`));
      return all.length ? `Here's what's waiting behind a prerequisite:\n${bullets(all.slice(0, 6))}\nFinish those prerequisites and each one opens up.` : 'Nothing is locked right now — every open topic can be studied.';
    }
    if (/(track|deadline|on pace|on schedule|finish by|when will|behind|late|target)/.test(q)) {
      const rows = ctx.goals.filter((g) => g.forecast.status !== 'empty').map((g) => `${g.title}: ${g.forecast.headline}`);
      return rows.length ? `Deadline check:\n${bullets(rows)}` : 'You have no goals with topics yet, so there is nothing to forecast.';
    }
    if (/(next|study today|what should|what do i do|plan|focus|start)/.test(q)) {
      if (!ctx.plan.length) return 'Nothing is unlocked right now. Finish a prerequisite (or ask your mentor to review a submission) to open the next topic.';
      const [p, ...more] = ctx.plan;
      return `Start with ${p.title} for about ${p.minutes} minutes. ${p.reason}` + (more.length ? `\nAfter that this week: ${more.map((m) => `${m.title} (${m.minutes}m)`).join(', ')}.` : '');
    }
    if (/(how am i|progress|doing|week|review|streak|summary)/.test(q)) {
      const w = ctx.week;
      const parts = [`This week you studied ${fmtMin(w.minutes)} over ${plural(w.sessions, 'session')} — ${w.targetPercent}% of your ${fmtMin(w.targetMinutes)} target.`];
      if (w.streak) parts.push(`Your streak is ${w.streak} day${w.streak === 1 ? '' : 's'}.`);
      if (w.completed.length) parts.push(`Finished: ${w.completed.join(', ')}.`);
      if (w.stalled.length) parts.push(`${w.stalled[0].title} has gone quiet for ${w.stalled[0].daysSince} days.`);
      return parts.join(' ');
    }
    if (/(motivat|tired|lazy|procrastinat|overwhelm|hard|can'?t focus|no time)/.test(q)) {
      const p = ctx.plan[0];
      return p ? `That's normal. Lower the bar: do 15 focused minutes on ${p.title}, then decide whether to stop. Starting is the hard part, and short sessions keep your streak alive.` : 'That is normal. Pick the smallest task you can finish in 15 minutes and do only that.';
    }
    if (/^(hi|hello|hey|yo|good (morning|afternoon|evening))\b/.test(q.trim())) return `Hi ${first}! I can tell you what to study next, whether you're on track for your deadlines, what's locked, or how your week went.`;
    return "I can help with what to study next, whether you're on track, what's locked and why, and how your week went. Try one of those. (I'm the built-in coach; add a Gemini API key for open-ended questions.)";
  }

  /* ============================================================ CSV export */

  /** CSV cell with quote escaping and protection against spreadsheet formula injection (=, +, -, @ at the start). */
  const csvCell = (v) => {
    let s = v == null ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const toCsv = (rows) => rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
  const hours = (m) => (Math.round(((m || 0) / 60) * 10) / 10).toFixed(1);

  function topicsCsv({ goals, topics, sessions }) {
    const rows = [['Goal', 'Topic', 'Status', 'Prerequisites', 'Estimate (h)', 'Logged (h)', 'Completed on']];
    const label = { complete: 'Complete', locked: 'Locked', pending: 'Awaiting approval', in_progress: 'In progress', available: 'Ready' };
    for (const g of goals) {
      const gt = topics.filter((t) => t.goalId === g.id);
      const gs = sessions.filter((s) => s.goalId === g.id);
      const st = R.computeStates(gt, R.minutesByTopic(gs));
      const mins = R.minutesByTopic(gs);
      for (const t of gt) rows.push([g.title, t.title, label[st[t.id].state], t.prerequisites.map((p) => (gt.find((x) => x.id === p) || {}).title).filter(Boolean).join('; '), t.estimateMinutes ? hours(t.estimateMinutes) : '', hours(mins[t.id] || 0), t.completedOn || '']);
    }
    return toCsv(rows);
  }
  function sessionsCsv({ goals, topics, sessions }) {
    const rows = [['Date', 'Time', 'Goal', 'Topic', 'Minutes', 'Note']];
    const gT = new Map(goals.map((g) => [g.id, g.title]));
    const tT = new Map(topics.map((t) => [t.id, t.title]));
    [...sessions].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)).forEach((s) => rows.push([s.date, s.time || '', gT.get(s.goalId) || '', tT.get(s.topicId) || '', s.minutes, s.note || '']));
    return toCsv(rows);
  }

  return { DAYS, fmtMin, fmtDate, weekdayOf, goalForecast, WARNING_STATUSES, habits, suggestSchedule, TEMPLATES, fallbackRoadmap, sanitizeRoadmap, sanitizeQuiz, fallbackQuiz, buildCoachContext, coachFallback, COACH_CHIPS, csvCell, topicsCsv, sessionsCsv };
});

</script>
<script>/* shared/seed-data.js */
/*
 * Seed dataset, as pure data (used by the MongoDB seeder and by the offline preview).
 * Brief: three goals, 12 topics with prerequisites, 30 sessions spread over six weeks.
 * Dates are expressed as day offsets from "today" so the demo always looks fresh.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./rules'));
  else root.SeedData = factory(root.Rules);
})(typeof self !== 'undefined' ? self : this, function (Rules) {
  'use strict';

  const goals = [
    { key: 'dsa', title: 'Master Data Structures & Algorithms', color: 'violet', description: 'Interview-ready fundamentals, from complexity analysis to dynamic programming.', targetOffset: 45 },
    { key: 'web', title: 'Full-Stack Web Development', color: 'cyan', description: 'Ship a secure, database-backed web app end to end.', targetOffset: 60 },
    { key: 'ml', title: 'Applied Machine Learning', color: 'mint', description: 'Build, evaluate and explain classical ML models in Python.', targetOffset: 75 },
  ];

  // completeOffset: day (relative to today) the topic was finished; null = not complete.
  const topics = [
    { key: 'bigo', hours: 3, goal: 'dsa', title: 'Big-O & Complexity', prereqs: [], completeOffset: -34, description: 'Asymptotic notation and reasoning about cost.' },
    { key: 'arrays', hours: 6, goal: 'dsa', title: 'Arrays & Strings', prereqs: ['bigo'], completeOffset: -27, description: 'Two pointers, sliding window, prefix sums.' },
    { key: 'lists', hours: 6, goal: 'dsa', title: 'Linked Lists & Stacks', prereqs: ['arrays'], completeOffset: null, notes: 'Practise: reverse a list iteratively and recursively, then build an LRU cache.', resources: [{ title: 'VisuAlgo — linked lists', url: 'https://visualgo.net/en/list' }], description: 'Pointer manipulation, monotonic stacks.' },
    { key: 'trees', hours: 8, goal: 'dsa', title: 'Trees & Graphs', prereqs: ['lists', 'arrays'], completeOffset: null, description: 'Traversals, BFS/DFS, shortest paths.' },
    { key: 'dp', hours: 10, goal: 'dsa', title: 'Dynamic Programming', prereqs: ['trees', 'bigo'], completeOffset: null, description: 'Memoisation, tabulation, state design.' },

    { key: 'js', hours: 6, goal: 'web', title: 'HTML, CSS & JavaScript', prereqs: [], completeOffset: -30, description: 'The platform fundamentals: DOM, events, async.' },
    { key: 'node', hours: 10, goal: 'web', title: 'Node & Express', prereqs: ['js'], completeOffset: -18, description: 'Routing, middleware and REST design.' },
    { key: 'mongo', hours: 8, goal: 'web', title: 'MongoDB & Data Modelling', prereqs: ['node'], completeOffset: null, notes: 'Embed when data is read together; reference when it grows without bound.', resources: [{ title: 'MongoDB Manual — Indexes', url: 'https://www.mongodb.com/docs/manual/indexes/' }], description: 'Schemas, indexes and aggregation pipelines.' },
    { key: 'auth', hours: 8, goal: 'web', title: 'Auth & Security', prereqs: ['node', 'mongo'], completeOffset: null, description: 'Sessions, JWT, hashing and role-based access.' },

    { key: 'py', hours: 5, goal: 'ml', title: 'Python & NumPy', prereqs: [], completeOffset: -33, description: 'Vectorised thinking with arrays.' },
    { key: 'sup', hours: 10, goal: 'ml', title: 'Supervised Learning', prereqs: ['py'], completeOffset: null, resources: [{ title: 'scikit-learn — supervised learning', url: 'https://scikit-learn.org/stable/supervised_learning.html' }], description: 'Regression, trees and the bias-variance trade-off.' },
    { key: 'eval', hours: 6, goal: 'ml', title: 'Model Evaluation', prereqs: ['sup'], completeOffset: null, description: 'Cross-validation, metrics and error analysis.' },
  ];

  // [topic, dayOffset, minutes, note]  — 30 sessions, oldest to newest, always on unlocked topics.
  const sessions = [
    ['bigo', -41, 45, 'Asymptotic notation basics'],
    ['js', -41, 90, 'DOM and the event loop'],
    ['ml1', -40, 60, 'Vectorisation drills'],
    ['bigo', -39, 30, 'Amortised analysis examples'],
    ['py', -38, 50, 'Broadcasting rules'],
    ['js', -37, 75, 'Closures and promises'],
    ['bigo', -36, 40, 'Practice problems'],
    ['py', -35, 45, 'Slicing and reshaping'],
    ['js', -33, 60, 'Fetch and modules'],
    ['arrays', -33, 50, 'Prefix sums'],
    ['arrays', -31, 60, 'Two pointers'],
    ['arrays', -29, 45, 'Sliding window'],
    ['node', -29, 70, 'First Express server'],
    ['sup', -28, 60, 'Linear regression from scratch'],
    ['node', -26, 60, 'Express routing'],
    ['lists', -25, 45, 'Reversal and cycle detection'],
    ['sup', -24, 55, 'Regularisation'],
    ['node', -22, 80, 'Middleware chains'],
    ['lists', -21, 40, 'Fast and slow pointers'],
    ['node', -20, 55, 'Error handling patterns'],
    ['mongo', -16, 65, 'Schema design'],
    ['lists', -14, 55, 'LRU cache'],
    ['sup', -17, 70, 'Decision trees'],
    ['mongo', -12, 50, 'Indexes and explain()'],
    ['sup', -11, 45, 'Bias-variance notes'],
    ['lists', -9, 35, 'Monotonic stack'],
    ['mongo', -7, 60, 'Aggregation pipeline'],
    ['lists', -2, 30, 'Stack problems'],
    ['sup', -1, 50, 'Cross-validation prep'],
    ['mongo', 0, 45, 'Population and lean queries'],
  ].map(([t, d, m, n]) => [t === 'ml1' ? 'py' : t, d, m, n]);

  // Learners in the demo mostly study in the evening on weekdays and in the morning at weekends.
  const startTime = (date, i) => {
    const dow = Rules.weekdayOf ? Rules.weekdayOf(date) : new Date(date + 'T00:00:00Z').getUTCDay();
    return dow === 0 || dow === 6 ? ['10:00', '10:30', '09:30'][i % 3] : ['19:30', '20:00', '19:00'][i % 3];
  };

  function build(today) {
    return {
      goals: goals.map((g) => ({ ...g, targetDate: Rules.addDays(today, g.targetOffset) })),
      topics: topics.map((t) => ({ ...t, estimateMinutes: (t.hours || 0) * 60, notes: t.notes || '', resources: t.resources || [], completedOn: t.completeOffset == null ? '' : Rules.addDays(today, t.completeOffset) })),
      sessions: sessions.map(([topic, off, minutes, note], i) => { const date = Rules.addDays(today, off); return { topic, date, minutes, note, time: startTime(date, i) }; }),
    };
  }

  // A goal a mentor assigned to a second learner (requires approval). Kept separate so the main learner
  // keeps exactly the brief's 3 goals / 12 topics / 30 sessions.
  function buildAssigned(today) {
    const topicsA = [
      { key: 'rq', title: 'Research questions & hypotheses', hours: 3, prereqs: [], status: 'complete', completedOffset: -20, description: 'Turn a vague interest into a testable question.' },
      { key: 'lit', title: 'Literature review', hours: 5, prereqs: [], status: 'pending', description: 'Find, read and summarise the key prior work.' },
      { key: 'design', title: 'Study design & sampling', hours: 5, prereqs: ['rq'], status: 'open', description: 'Choose a design and a defensible sample.' },
      { key: 'ethics', title: 'Data collection & ethics', hours: 4, prereqs: ['design'], status: 'open', description: 'Collect data responsibly, with consent.' },
      { key: 'report', title: 'Analysis & reporting', hours: 6, prereqs: ['ethics', 'lit'], status: 'open', description: 'Analyse, interpret and write up the findings.' },
    ].map((t) => ({ ...t, estimateMinutes: t.hours * 60, notes: '', resources: [], completedOn: t.status === 'complete' ? Rules.addDays(today, t.completedOffset) : '', pending: t.status === 'pending' }));
    const sess = [['rq', -24, 45, 'Brainstormed three candidate questions'], ['rq', -22, 40, 'Narrowed to one'], ['lit', -18, 60, 'First pass through 10 papers'], ['lit', -15, 50, 'Summary table'], ['lit', -11, 55, 'Gaps and themes'], ['design', -6, 45, 'Compared survey vs experiment'], ['design', -2, 40, 'Sampling options']]
      .map(([topic, off, minutes, note], i) => { const date = Rules.addDays(today, off); return { topic, date, minutes, note, time: startTime(date, i + 1) }; });
    return { goal: { title: 'Research Methods Fundamentals', description: 'Assigned by your mentor — plan, run and report a small study. Each topic needs mentor approval.', color: 'rose', targetDate: Rules.addDays(today, 30) }, topics: topicsA, sessions: sess };
  }

  return { build, buildAssigned, goals, topics, sessions };
});

<script>/* tools/mock-api.js */
/*
 * In-browser stand-in for client/js/api.js, used ONLY by the offline preview (npm run preview).
 * Same interface and response shapes as the real REST API, backed by the same shared/rules.js and
 * shared/seed-data.js the server uses, so the preview behaves like the real thing (locks, loops, limits, roles).
 * Data lives in memory and resets on reload.
 */
window.API = (function () {
  'use strict';
  const R = window.Rules;
  const F = window.Features;
  const STATUS = { VALIDATION: 400, FORBIDDEN: 403, NOT_FOUND: 404, LOCKED: 409, CONFLICT: 409 };

  class ApiError extends Error {

      super(message);
